# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
[graph]
all-features = true
exclude = [
    # dev only dependency
    "criterion"
]

[advisories]
version = 2
ignore = [
    # Pulled in transitively via `openmls 0.8.1 -> fluvio-wasm-timer 0.2.5 -> parking_lot 0.11
    # -> instant 0.1.13` on the wasm32 build path. The author recommends `web-time`, but
    # `fluvio-wasm-timer` (and thus `openmls` for its wasm32 timer impl) has not migrated.
    # No upgrade path available; tracked for openmls upstream bump.
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained `instant`, transitive via openmls 0.8.1 wasm timer; no upgrade available." },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# We should disallow this, but it's currently a PITA.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
