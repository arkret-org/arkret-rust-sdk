[package]
name = "arkret-deployment-contracts"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure transport contracts for separately deployed Arkret products; not canonical protocol operations."
homepage.workspace = true

[features]
default = []
openapi = ["dep:salvo-oapi", "arkret-identifiers/openapi", "arkret-models-collaboration/openapi", "arkret-wire/openapi", "salvo-oapi/chrono"]

[dependencies]
arkret-canonical.workspace = true
arkret-identifiers.workspace = true
arkret-models-collaboration.workspace = true
arkret-wire.workspace = true
chrono = { workspace = true, features = ["serde"] }
salvo-oapi = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
url.workspace = true

[lints]
workspace = true
