[package]
authors.workspace = true
description = "Arkret v1 DID identity behavior: resolvers, handle claims, DID key-log records, and detached-JWS verification."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "did", "identity", "resolver"]
license.workspace = true
name = "arkret-identity"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
native-backup = ["dep:arkret-crypto", "dep:getrandom", "dep:hmac", "dep:sha2", "dep:zeroize"]

[dependencies]
arkret-canonical = { workspace = true }
arkret-crypto = { workspace = true, optional = true, features = ["hpke", "content-history", "backup"] }
arkret-egress-policy = { workspace = true }
arkret-event-draft = { workspace = true }
# Batch 4c (core retirement): the service identity bundle backends (file +
# KeyStore persistence) moved here from the `arkret` umbrella. They wrap a `KeyStore`
# from arkret-keystore, a leaf crate (no arkret deps), so the edge is
# cycle-free.
arkret-keystore = { workspace = true }
arkret-models-identity = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-integration = { workspace = true }
arkret-models-crypto = { workspace = true }
arkret-signatures = { workspace = true, features = ["service-identity", "webvh", "keypackages"] }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
getrandom = { workspace = true }
arkret-signatures = { workspace = true, features = ["signer"] }
arkret-schema-conformance = { workspace = true }
arkret-schema = { workspace = true }
arkret-state = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
