[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 DID identity behavior: resolvers, handle claims, DID key-log records, and detached-JWS verification."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "did", "identity", "resolver"]
license = "Apache-2.0"
name = "arkret-identity"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[dependencies]
arkret-canonical = {workspace = true}
arkret-egress-policy = {workspace = true}
arkret-identifiers = {workspace = true}
# Batch 4c (core retirement): the service identity bundle backends (file +
# KeyStore persistence) moved here from the `arkret` umbrella. They wrap a `KeyStore`
# from arkret-keystore, a leaf crate (no arkret deps), so the edge is
# cycle-free.
arkret-keystore = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-signatures = {workspace = true,features = ["webvh"]}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
ed25519-dalek = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}

[dev-dependencies]
arkret-wire = {workspace = true,features = ["test-support"]}

[lints]
workspace = true
