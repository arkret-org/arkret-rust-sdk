[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 identity domain models: account, actor profile, device, DID continuity, and handle wire shapes."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "identity", "account", "wire"]
license = "Apache-2.0"
name = "arkret-models-identity"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []

[dependencies]
arkret-canonical = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
url = {workspace = true}

[lints]
workspace = true
