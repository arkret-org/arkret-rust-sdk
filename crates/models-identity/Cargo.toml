[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 identity domain models: account, actor profile, device, DID continuity, and handle wire shapes."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "identity", "account", "wire"]
license = "Apache-2.0"
name = "arkret-models-identity"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# OpenAPI `ToSchema` derives on the identity wire types. Off by default so the
# data-layer graph stays framework-free; service crates opt in. Forwards to the
# wire/identifier newtypes and enables salvo-oapi's chrono schemas.
openapi = [
    "dep:salvo-oapi",
    "arkret-wire/openapi",
    "salvo-oapi/chrono",
]

[dependencies]
arkret-canonical = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
salvo-oapi = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
url = {workspace = true}

[lints]
workspace = true
