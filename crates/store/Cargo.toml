[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 durable store contracts and conformance helpers."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "store", "sqlite", "indexeddb"]
license = "Apache-2.0"
name = "contrix-store"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.7.0"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
