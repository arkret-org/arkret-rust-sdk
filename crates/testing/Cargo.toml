[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 reusable conformance fixtures and catalog coverage helpers."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "testing", "conformance", "fixtures"]
license = "Apache-2.0"
name = "cokret-testing"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version = "1.92"
version.workspace = true

[features]
default = []

[dependencies]
cokret-contracts.workspace = true
cokret-core.workspace = true
cokret-crypto.workspace = true
cokret-ffi.workspace = true
cokret-html.workspace = true
cokret-signatures.workspace = true
sha2.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
