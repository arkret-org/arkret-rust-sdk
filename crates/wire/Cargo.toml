[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 cross-domain wire primitives and state object shapes."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "protocol", "wire"]
license = "Apache-2.0"
name = "arkret-wire"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# OpenAPI `ToSchema` derives on the shared wire primitives. Off by default so
# the data-layer graph stays framework-free; service crates opt in. Forwards to
# the identifier newtypes and enables salvo-oapi's chrono schemas for the
# canonical `DateTime<Utc>` timestamps carried by proofs and records.
openapi = ["dep:salvo-oapi", "arkret-identifiers/openapi", "salvo-oapi/chrono"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
salvo-oapi = {workspace = true,optional = true}
getrandom = {workspace = true}
hex = {workspace = true}
idna = {workspace = true}
precis-profiles = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
unicode-normalization = {workspace = true}
unicode-security = {workspace = true}
web-time = {workspace = true}
url = {workspace = true}

[lints]
workspace = true
