[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 cross-domain wire primitives and state object shapes."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "protocol", "wire"]
license = "Apache-2.0"
name = "arkret-wire"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
salvo-oapi = ["dep:salvo", "salvo/oapi", "arkret-identifiers/salvo"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
getrandom = {workspace = true}
hex = {workspace = true}
idna = {workspace = true}
precis-profiles = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
unicode-normalization = {workspace = true}
unicode-security = {workspace = true}
url = {workspace = true}

[lints]
workspace = true
