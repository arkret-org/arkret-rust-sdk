[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 protocol event taxonomy and strongly typed event content models."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "events", "protocol", "collaboration"]
license = "Apache-2.0"
name = "contrix-events"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.2.0"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
