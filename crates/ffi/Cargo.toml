[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 FFI and WASM embedding contracts."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "ffi", "wasm", "uniffi"]
license = "Apache-2.0"
name = "cokret-ffi"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
client = ["cokret-core/client"]
mls = ["cokret-core/mls"]

[dependencies]
cokret-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
