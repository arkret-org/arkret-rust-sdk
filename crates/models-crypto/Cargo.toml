[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 crypto domain models: key backup, key distribution, MLS payload, and encrypted envelope wire shapes."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "crypto", "keys", "wire"]
license = "Apache-2.0"
name = "arkret-models-crypto"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
salvo-oapi = [
  "dep:salvo",
  "salvo/oapi",
  "arkret-models-identity/salvo-oapi",
  "arkret-wire/salvo-oapi",
]

[dependencies]
arkret-canonical = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
hex = {workspace = true}
regex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}

[lints]
workspace = true
