[package]
authors.workspace = true
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 crypto models: encrypted material, MLS payloads, and durable security transactions."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "crypto", "keys", "wire"]
license.workspace = true
name = "arkret-models-crypto"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
openapi = ["dep:salvo-oapi", "arkret-wire/openapi", "salvo-oapi/chrono"]

[dependencies]
arkret-canonical = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
curve25519-dalek = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
salvo-oapi = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-schema = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
ed25519-dalek.workspace = true

[lints]
workspace = true
