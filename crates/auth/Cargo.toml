[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 authentication behavior: sessions, session grants, claims, passwords, MFA, and DID/OIDC/passkey proof verification."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "auth", "session", "did"]
license = "Apache-2.0"
name = "arkret-auth"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-wire = {workspace = true}
argon2 = {workspace = true}
base64 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
getrandom = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
uuid = {workspace = true}

[lints]
workspace = true
