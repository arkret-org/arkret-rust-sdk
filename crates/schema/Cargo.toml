[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "development-tools"]
description = "Arkret v1 schema catalog, validators, and spec artifact tooling."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "schema", "conformance"]
license = "Apache-2.0"
name = "arkret-schema"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
embedded-artifacts = []

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
jsonschema = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
web-time = {workspace = true}

[dev-dependencies]
arkret-models-crypto = {workspace = true}
hex = {workspace = true}

[lints]
workspace = true
