[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "development-tools"]
description = "Arkret v1 schema catalog, validators, and spec artifact tooling."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "schema", "conformance"]
license = "Apache-2.0"
name = "arkret-schema"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
embedded-artifacts = []
salvo-oapi = ["dep:salvo", "salvo/oapi", "arkret-wire/salvo-oapi"]

[dependencies]
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
regex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}

[lints]
workspace = true
