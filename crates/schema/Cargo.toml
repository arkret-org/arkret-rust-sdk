[package]
authors.workspace = true
categories = ["api-bindings", "development-tools"]
description = "Arkret v1 typed schema contracts and runtime validators."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "schema", "conformance"]
license.workspace = true
name = "arkret-schema"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []

[dependencies]
arkret-canonical = { workspace = true }
arkret-identifiers = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-models-crypto = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
hex = { workspace = true }

[lints]
workspace = true
