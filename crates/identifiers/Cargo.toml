[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["data-structures", "encoding"]
description = "Validated Contrix v1 identifiers, DID helpers, hashes, cursors and HLC values."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "identifiers", "did", "protocol"]
license = "Apache-2.0"
name = "contrix-identifiers"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono"]

[dependencies]
getrandom.workspace = true
salvo = { workspace = true, optional = true, features = ["oapi"] }
salvo-oapi = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
