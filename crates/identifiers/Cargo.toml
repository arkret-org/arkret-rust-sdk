[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["data-structures", "encoding"]
description = "Validated Arkret v1 identifiers, DID helpers, hashes, cursors and HLC values."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "identifiers", "did", "protocol"]
license = "Apache-2.0"
name = "arkret-identifiers"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Server-only: PostgreSQL `uuid` ToSql/FromSql for the pure-uuid typed ids so
# they persist as native `uuid` columns. `postgres_backend` gives the Pg type
# + serialize/deserialize traits WITHOUT linking libpq, so this stays a pure
# Rust dep suitable for the protocol crate. Never activated on wasm builds.
diesel = ["dep:diesel"]

[dependencies]
arkret-canonical = {workspace = true}

# wasm32 randomness: getrandom 0.3 needs the `wasm_js` feature, and the
# transitive getrandom 0.2 (pulled in via `rand_core` from ed25519-dalek
# and friends) needs the `js` feature. uuid additionally requires its
# own `js` feature to wire up the wasm-bindgen RNG path on
# `wasm32-unknown-unknown`. Declared here so the feature resolver
# activates the JS-backed RNG backends whenever the workspace is built
# for `wasm32-unknown-unknown`.
diesel = {workspace = true,features = [
    "postgres_backend",
    "uuid",
],optional = true}
getrandom = {workspace = true}
serde = {workspace = true}
thiserror = {workspace = true}
uuid = {workspace = true}
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = {workspace = true,default-features = true,features = ["wasm_js"]}
getrandom_02 = {workspace = true,features = ["js"]}
uuid = {workspace = true,default-features = false,features = [
    "std",
    "v7",
    "serde",
    "js",
]}

[dev-dependencies]
serde_json = {workspace = true}

[lints]
workspace = true
