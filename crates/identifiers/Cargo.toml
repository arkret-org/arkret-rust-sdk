[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["data-structures", "encoding"]
description = "Validated Cokret v1 identifiers, DID helpers, hashes, cursors and HLC values."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "identifiers", "did", "protocol"]
license = "Apache-2.0"
name = "cokret-identifiers"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version = "1.92"
version = "1.0.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono"]

[dependencies]
getrandom.workspace = true
salvo = { workspace = true, optional = true, features = ["oapi"] }
salvo-oapi = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

# wasm32 randomness: getrandom 0.3 needs the `wasm_js` feature, and the
# transitive getrandom 0.2 (pulled in via `rand_core` from ed25519-dalek
# and friends) needs the `js` feature. uuid additionally requires its
# own `js` feature to wire up the wasm-bindgen RNG path on
# `wasm32-unknown-unknown`. Declared here so the feature resolver
# activates the JS-backed RNG backends whenever the workspace is built
# for `wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde", "js"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
