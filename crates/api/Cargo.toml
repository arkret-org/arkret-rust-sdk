[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 protocol surface catalog, service endpoint metadata, and wire helper models."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "api", "protocol", "sdk"]
license = "Apache-2.0"
name = "contrix-api"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.7.0"

[features]
default = []
salvo = [
    "dep:salvo",
    "salvo/oapi",
    "dep:salvo-oapi",
    "salvo-oapi/chrono",
    "contrix-core/salvo",
]

[dependencies]
chrono.workspace = true
contrix-core.workspace = true
contrix-crypto.workspace = true
contrix-html.workspace = true
contrix-signatures.workspace = true
salvo = { workspace = true, optional = true, features = ["oapi"] }
salvo-oapi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
