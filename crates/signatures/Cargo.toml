[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 canonical signatures, proof binding, and HTTP message signature models."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "signature", "federation", "protocol"]
license = "Apache-2.0"
name = "cokret-signatures"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
signer = []

[dependencies]
# RFC 9421 HTTP Message Signatures + detached-JWS Ed25519 verify are always
# available (the federation / push / teabay ingest verifiers need them
# unconditionally); the `signer` feature is retained for API compatibility but
# no longer gates these crypto deps.
base64 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
cokret-core = {workspace = true}
ed25519-dalek = {workspace = true}
rand_core = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
url = {workspace = true}

[dev-dependencies]
cokret-core = {workspace = true}
rand_chacha = {workspace = true}
serde_json = {workspace = true}
# SDK-SOTA-03 microbenchmarks (run on demand with `cargo bench`, never in CI).
criterion = {workspace = true}

[[bench]]
harness = false
name = "proof_verify"

[lints]
workspace = true
