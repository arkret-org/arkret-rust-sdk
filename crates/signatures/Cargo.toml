[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 canonical signatures, proof binding, and HTTP message signature models."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "signature", "federation", "protocol"]
license = "Apache-2.0"
name = "arkret-signatures"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
collaboration = ["dep:arkret-models-collaboration"]
keypackages = ["dep:arkret-models-crypto"]
service-identity = ["dep:arkret-models-identity"]
webvh = ["dep:arkret-models-discovery", "dep:arkret-models-identity"]
signer = []

[dependencies]
# RFC 9421 HTTP Message Signatures + detached-JWS Ed25519 verify are always
# available (the federation / push / teabay ingest verifiers need them
# unconditionally); the `signer` feature is retained for API compatibility but
# no longer gates these crypto deps.
base64 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
arkret-canonical = {workspace = true}
# Optional data crates are enabled only by the behavior that signs their
# models. The model leaves must not be unified by a composite feature.
arkret-models-collaboration = {workspace = true,optional = true}
arkret-models-crypto = {workspace = true,optional = true}
arkret-models-discovery = {workspace = true,optional = true}
arkret-models-identity = {workspace = true,optional = true}
arkret-wire = {workspace = true}
ed25519-dalek = {workspace = true}
rand_core = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
url = {workspace = true}
uuid = {workspace = true}
zeroize = {workspace = true,default-features = true}

[dev-dependencies]
arkret-identifiers = {workspace = true}
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
rand_chacha = {workspace = true}
serde_json = {workspace = true}
# SDK-SOTA-03 microbenchmarks (run on demand with `cargo bench`, never in CI).
criterion = {workspace = true}

[[bench]]
harness = false
name = "proof_verify"

[lints]
workspace = true
