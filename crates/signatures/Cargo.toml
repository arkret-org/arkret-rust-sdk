[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 canonical signatures, proof binding, and HTTP message signature models."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "signature", "federation", "protocol"]
license = "Apache-2.0"
name = "contrix-signatures"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version = "1.92"
version = "1.0.0"

[features]
default = []
signer = ["dep:ed25519-dalek", "dep:sha2"]

[dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
ed25519-dalek = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
contrix-core = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
