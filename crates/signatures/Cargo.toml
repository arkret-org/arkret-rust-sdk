[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 canonical signatures, proof binding, and HTTP message signature models."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "signature", "federation", "protocol"]
license = "Apache-2.0"
name = "contrix-signatures"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.3.0"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
