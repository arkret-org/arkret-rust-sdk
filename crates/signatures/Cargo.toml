[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 canonical signatures, proof binding, and HTTP message signature models."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "signature", "federation", "protocol"]
license = "Apache-2.0"
name = "cokret-signatures"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
signer = []

[dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
cokret-core.workspace = true
# RFC 9421 HTTP Message Signatures + detached-JWS Ed25519 verify are always
# available (the federation / push / teabay ingest verifiers need them
# unconditionally); the `signer` feature is retained for API compatibility but
# no longer gates these crypto deps.
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
cokret-core = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
