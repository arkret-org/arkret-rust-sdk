[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 client-server protocol API contracts."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "client", "api", "protocol"]
license = "Apache-2.0"
name = "contrix-client-api"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.2.0"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
contrix-crypto.workspace = true
contrix-events.workspace = true
contrix-html.workspace = true
contrix-push-gateway-api.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
