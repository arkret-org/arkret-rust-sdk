[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 MLS (RFC 9420) behavior layer over OpenMLS."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "mls", "e2ee", "openmls"]
license = "Apache-2.0"
name = "arkret-mls"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
test-utils = []

[dependencies]
aes-gcm = { workspace = true }
arkret-canonical = { workspace = true }
arkret-crypto = { workspace = true, features = ["aead", "sframe"] }
arkret-identifiers = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-crypto = { workspace = true }
arkret-policy = { workspace = true }
arkret-signatures = { workspace = true, features = ["keypackages"] }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }

# openmls is split per-target because the upstream crate hard-requires the
# `js` cargo feature on wasm32 (it pulls fluvio_wasm_timer + js-sys for time
# and randomness). Native targets must NOT enable `js` (no js-sys available).
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tls_codec = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true, default-features = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmls = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { workspace = true, features = ["js"] }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
# secret_share HPKE seal/open is exercised only by the history-sharing test.
arkret-crypto = { workspace = true, features = ["aead", "secret-share"] }
# Spec fixture tests load the private-kdf artifact from the explicit spec checkout.
arkret-schema = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
