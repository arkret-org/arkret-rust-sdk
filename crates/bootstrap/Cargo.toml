[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["algorithms", "data-structures"]
description = "Arkret principal-control and agent bootstrap validation."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "bootstrap", "identity", "protocol"]
license = "Apache-2.0"
name = "arkret-bootstrap"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[dependencies]
arkret-canonical = { workspace = true }
arkret-event-draft = { workspace = true }
arkret-lattice-registry = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-identity = { workspace = true }
arkret-state = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }

# `arkret-schema` is deliberately NOT a normal dependency: the frozen layering
# in tools/check-layering.py does not allow bootstrap -> schema, which is why
# the projection evaluator is injected through `CellWriteProjector`. The tests
# wire in the real evaluator so the asserted genesis leaf sets are the ones the
# event-kind registry actually produces, not a stub's opinion — the same
# dev-only arrangement arkret-state and arkret-models-collaboration use.
[dev-dependencies]
arkret-schema = { workspace = true }
# The multi-suite Seal assertions must run against a real Ed25519 notary
# signature, so the dev build takes the production signer backend rather than
# a stub that would only prove the builder agrees with itself.
arkret-signatures = { workspace = true, features = ["signer"] }
arkret-wire = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
