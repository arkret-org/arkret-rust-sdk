[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["data-structures", "encoding"]
description = "Arkret v1 clock- and entropy-backed protocol value generators: the monotonic HLC generator and the sync cursor mint/validate surface."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "hlc", "cursor", "protocol"]
license = "Apache-2.0"
name = "arkret-hlc"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# The cursor surface moved to arkret-wire; its `ToSchema` derives are gated by
# arkret-wire's `salvo-oapi` feature, re-exported through this crate's shim.
salvo = ["arkret-wire/salvo-oapi", "arkret-identifiers/salvo"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
arkret-wire = {workspace = true}
thiserror = {workspace = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
serde_json = {workspace = true}

[lints]
workspace = true
