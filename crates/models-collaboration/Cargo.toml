[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 collaboration domain models: governance, collaboration objects, event payloads, sync and federation frames."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "governance", "wire"]
license = "Apache-2.0"
name = "arkret-models-collaboration"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
salvo-oapi = [
    "dep:salvo",
    "salvo/oapi",
    "arkret-wire/salvo-oapi",
    "arkret-models-crypto/salvo-oapi",
    "arkret-models-identity/salvo-oapi",
]

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
chrono-tz = {workspace = true}
hmac = {workspace = true}
regex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
unicode-normalization = {workspace = true}

[lints]
workspace = true
