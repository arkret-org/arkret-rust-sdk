[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 push gateway, webhook, applet, and external integration exchange models."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "push", "integration", "wire"]
license = "Apache-2.0"
name = "arkret-models-integration"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []

[dependencies]
arkret-canonical = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
serde = {workspace = true}
serde_json = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}

[lints]
workspace = true
