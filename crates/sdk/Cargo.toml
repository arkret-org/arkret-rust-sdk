[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Contrix v1 decentralized collaboration protocol SDK."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "collaboration", "did", "sdk"]
license = "Apache-2.0"
name = "contrix"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.7.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = [
    "client",
    "mls",
    "full-surface",
    "applet-runtime",
    "device-runtime",
    "sync-runtime",
    "timeline-runtime",
]
client = ["dep:contrix-http-client", "dep:reqwest", "dep:tokio", "contrix-core/client", "contrix-ffi/client"]
signer = ["contrix-signatures/signer"]
server = ["dep:contrix-server", "full-surface"]
mls = [
    "full-surface",
    "contrix-core/mls",
    "contrix-ffi/mls",
    "dep:openmls",
    "dep:openmls_basic_credential",
    "dep:openmls_rust_crypto",
    "dep:tls_codec",
]
full-surface = []
tracing = ["dep:tracing"]
salvo = ["server", "dep:salvo", "salvo/oapi", "contrix-server/salvo", "contrix-core/salvo"]
salvo-adapter = ["salvo"]
applet-runtime = ["full-surface"]
device-runtime = ["full-surface"]
sync-runtime = ["full-surface"]
timeline-runtime = ["full-surface"]
# Round 23 (2026-05-09): expose contrix-core's platform KeyStore feature
# gates so apps embedding the umbrella `contrix` crate can opt into
# OS-native key storage without a direct contrix-core dependency.
keystore-macos = ["contrix-core/keystore-macos"]
keystore-linux = ["contrix-core/keystore-linux"]
keystore-windows = ["contrix-core/keystore-windows"]

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
contrix-api.workspace = true
contrix-http-client = { workspace = true, optional = true }
contrix-core.workspace = true
contrix-crypto.workspace = true
contrix-ffi.workspace = true
contrix-html.workspace = true
contrix-lattice.workspace = true
contrix-operations.workspace = true
contrix-server = { workspace = true, optional = true }
salvo = { workspace = true, optional = true, features = ["oapi"] }
contrix-signatures.workspace = true
contrix-state-res.workspace = true
contrix-testing.workspace = true
getrandom.workspace = true
openmls_basic_credential = { workspace = true, optional = true }
openmls_rust_crypto = { workspace = true, optional = true }
regex.workspace = true
reqwest = { workspace = true, optional = true, features = ["json", "gzip", "http2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tls_codec = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros"] }
tracing = { workspace = true, optional = true }
ulid.workspace = true
uuid.workspace = true
url = { workspace = true, optional = true, features = ["serde"] }

# openmls is split per-target because the upstream crate hard-requires the
# `js` cargo feature on wasm32 (it pulls fluvio_wasm_timer + js-sys for time
# and randomness). Native targets must NOT enable `js` (no js-sys available).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmls = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { workspace = true, optional = true, features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "export_openapi"
required-features = ["server"]

[[example]]
name = "server_endpoint_adapter"
required-features = ["server"]

[[example]]
name = "salvo_server"
required-features = ["salvo"]

[lints]
workspace = true
