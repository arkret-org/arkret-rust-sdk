[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 decentralized collaboration protocol SDK."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "collaboration", "did", "sdk"]
license = "Apache-2.0"
name = "contrix"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.1.0"

[features]
default = [
    "client",
    "mls",
    "full-surface",
    "applet-runtime",
    "device-runtime",
    "sync-runtime",
    "timeline-runtime",
]
client = ["dep:contrix-client", "dep:reqwest", "contrix-core/client", "contrix-ffi/client"]
server = ["dep:contrix-server", "full-surface"]
mls = [
    "full-surface",
    "contrix-core/mls",
    "contrix-ffi/mls",
    "dep:openmls",
    "dep:openmls_basic_credential",
    "dep:openmls_rust_crypto",
    "dep:tls_codec",
]
full-surface = []
tracing = ["dep:tracing"]
salvo-adapter = ["server", "contrix-server/salvo"]
applet-runtime = ["full-surface"]
device-runtime = ["full-surface"]
sync-runtime = ["full-surface"]
timeline-runtime = ["full-surface"]

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
contrix-api.workspace = true
contrix-appservice-api.workspace = true
contrix-client-api.workspace = true
contrix-client = { workspace = true, optional = true }
contrix-core.workspace = true
contrix-crypto.workspace = true
contrix-events.workspace = true
contrix-federation-api.workspace = true
contrix-ffi.workspace = true
contrix-html.workspace = true
contrix-identity-api.workspace = true
contrix-operations.workspace = true
contrix-push-gateway-api.workspace = true
contrix-schema.workspace = true
contrix-server = { workspace = true, optional = true }
contrix-signatures.workspace = true
contrix-state-res.workspace = true
contrix-store.workspace = true
contrix-testing.workspace = true
contrix-ui.workspace = true
getrandom.workspace = true
openmls = { workspace = true, optional = true }
openmls_basic_credential = { workspace = true, optional = true }
openmls_rust_crypto = { workspace = true, optional = true }
regex.workspace = true
reqwest = { workspace = true, optional = true, features = ["json", "gzip", "http2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tls_codec = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ulid.workspace = true
url = { workspace = true, optional = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "export_openapi"
required-features = ["server"]

[[example]]
name = "server_endpoint_adapter"
required-features = ["server"]

[lints]
workspace = true
