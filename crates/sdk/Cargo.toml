[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Cokret v1 decentralized collaboration protocol SDK."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "collaboration", "did", "sdk"]
license = "Apache-2.0"
name = "cokret"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = [
    "client",
    "mls",
    "full-surface",
    "applet-runtime",
    "device-runtime",
    "sync-runtime",
    "timeline-runtime",
]
client = ["dep:cokret-http-client", "dep:reqwest", "dep:tokio", "cokret-core/client", "cokret-ffi/client"]
signer = ["cokret-signatures/signer"]
server = ["dep:cokret-server", "full-surface"]
mls = [
    "full-surface",
    "cokret-core/mls",
    "cokret-ffi/mls",
    "dep:openmls",
    "dep:openmls_basic_credential",
    "dep:openmls_rust_crypto",
    "dep:tls_codec",
]
full-surface = []
tracing = ["dep:tracing"]
# Re-export the conformance/test-fixture crate. Opt-in so it never lands in
# downstream production builds of the umbrella `cokret` crate.
testing = ["dep:cokret-testing"]
salvo = [
    "server",
    "dep:salvo",
    "salvo/oapi",
    "cokret-contracts/salvo",
    "cokret-server/salvo",
    "cokret-core/salvo",
]
applet-runtime = ["full-surface"]
# Convenience umbrella for Applet developers: turns on the applet wire
# surface (`applet` / `applet_server` modules), the reqwest HTTP client
# (push transactions / query actors-realms), the framework-neutral
# server handler contracts and the ready-made Salvo `Router` factory.
# `cargo add cokret --features applet` is all an Applet service needs.
applet = ["applet-runtime", "client", "server", "salvo"]
device-runtime = ["full-surface"]
sync-runtime = ["full-surface"]
timeline-runtime = ["full-surface"]
# Round 23 (2026-05-09): expose the platform KeyStore feature gates so apps
# embedding the umbrella `cokret` crate can opt into OS-native key storage
# without a direct cokret-keystore dependency.
keystore-macos = ["cokret-keystore/keystore-macos"]
keystore-linux = ["cokret-keystore/keystore-linux"]
keystore-windows = ["cokret-keystore/keystore-windows"]

[dependencies]

# openmls is split per-target because the upstream crate hard-requires the
# `js` cargo feature on wasm32 (it pulls fluvio_wasm_timer + js-sys for time
# and randomness). Native targets must NOT enable `js` (no js-sys available).
argon2 = {workspace = true}
base64 = {workspace = true}
chacha20poly1305 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
chrono-tz = {workspace = true}
cokret-contracts = {workspace = true}
cokret-core = {workspace = true}
cokret-crypto = {workspace = true}
cokret-ffi = {workspace = true}
cokret-html = {workspace = true}
cokret-http-client = {workspace = true,optional = true}
cokret-keystore = {workspace = true}
cokret-server = {workspace = true,optional = true}
cokret-signatures = {workspace = true}
cokret-testing = {workspace = true,optional = true}
ed25519-dalek = {workspace = true}
getrandom = {workspace = true}
hex = {workspace = true}
hkdf = {workspace = true}
openmls_basic_credential = {workspace = true,optional = true}
openmls_rust_crypto = {workspace = true,optional = true}
parking_lot = {workspace = true}
regex = {workspace = true}
reqwest = {workspace = true,features = ["json", "gzip", "http2"],optional = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
tls_codec = {workspace = true,optional = true}
tokio = {workspace = true,features = ["rt", "macros"],optional = true}
tracing = {workspace = true,optional = true}
url = {workspace = true,features = ["serde"],optional = true}
uuid = {workspace = true}
x25519-dalek = {workspace = true}
zeroize = {workspace = true,default-features = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmls = {workspace = true,optional = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = {workspace = true,features = ["js"],optional = true}

[dev-dependencies]
tokio = {workspace = true,features = ["macros", "rt"]}

[lints]
workspace = true
