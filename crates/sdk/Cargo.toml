[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Arkret v1 decentralized collaboration protocol SDK."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "did", "sdk"]
license = "Apache-2.0"
name = "arkret"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
client = ["dep:arkret-http-client", "dep:reqwest", "dep:tokio", "arkret-core/client", "arkret-ffi/client"]
signer = ["arkret-signatures/signer"]
server = ["dep:arkret-server", "full-surface"]
mls = [
    "full-surface",
    "arkret-core/mls",
    "arkret-ffi/mls",
    "dep:openmls",
    "dep:openmls_basic_credential",
    "dep:openmls_rust_crypto",
    "dep:tls_codec",
]
full-surface = ["arkret-core/embedded-artifacts"]
# TLS backend passthrough (`cargo add arkret --features client,tls-rustls`
# gives a working https client out of the box). The SDK stays TLS-neutral
# without this feature. PQ-hybrid TLS (X25519MLKEM768) is a MUST for all
# profiles per arkret-spec transport-bindings section 5 — see the
# arkret-http-client crate docs for the recommended provider configuration.
tls-rustls = ["client", "arkret-http-client/tls-rustls", "reqwest/rustls"]
tracing = ["dep:tracing", "arkret-http-client?/tracing"]
salvo = [
    "server",
    "dep:salvo",
    "salvo/oapi",
    "arkret-server/salvo",
    "arkret-core/salvo",
    "arkret-state/salvo",
    # The applet transactions handler verifies signatures / resolves DIDs on
    # the blocking pool (tokio::task::spawn_blocking).
    "dep:tokio",
]
applet-runtime = ["full-surface", "server"]
# Convenience umbrella for Applet developers: turns on the applet wire
# surface (`applet` module), the reqwest HTTP client
# (push transactions / query actors-realms), the framework-neutral
# server handler contracts and the ready-made Salvo `Router` factory.
# `cargo add arkret --features applet` is all an Applet service needs.
applet = ["applet-runtime", "client", "server", "salvo"]
device-runtime = ["full-surface"]
sync-runtime = ["full-surface"]
timeline-runtime = ["full-surface"]
# Round 23 (2026-05-09): expose the platform KeyStore feature gates so apps
# embedding the umbrella `arkret` crate can opt into OS-native key storage
# without a direct arkret-keystore dependency.
keystore-macos = ["arkret-keystore/keystore-macos"]
keystore-linux = ["arkret-keystore/keystore-linux"]
keystore-windows = ["arkret-keystore/keystore-windows"]
keystore-encrypted-file = ["arkret-keystore/keystore-encrypted-file"]

[dependencies]

# openmls is split per-target because the upstream crate hard-requires the
# `js` cargo feature on wasm32 (it pulls fluvio_wasm_timer + js-sys for time
# and randomness). Native targets must NOT enable `js` (no js-sys available).
argon2 = {workspace = true}
arkret-canonical = {workspace = true}
base64 = {workspace = true}
chacha20poly1305 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
arkret-core = {workspace = true}
arkret-crypto = {workspace = true,features = ["identity-root"]}
arkret-ffi = {workspace = true}
arkret-http-client = {workspace = true,optional = true}
arkret-keystore = {workspace = true}
arkret-network-policy = {workspace = true}
arkret-server = {workspace = true,optional = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-state = {workspace = true}
arkret-wire-base = {workspace = true}
ed25519-dalek = {workspace = true}
getrandom = {workspace = true}
hex = {workspace = true}
hkdf = {workspace = true}
hmac = {workspace = true}
hpke = {workspace = true}
rand_core_09 = {workspace = true}
openmls_basic_credential = {workspace = true,optional = true}
openmls_rust_crypto = {workspace = true,optional = true}
parking_lot = {workspace = true}
regex = {workspace = true}
reqwest = {workspace = true,features = ["json", "gzip", "http2"],optional = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
tls_codec = {workspace = true,optional = true}
tokio = {workspace = true,features = ["rt", "macros"],optional = true}
tracing = {workspace = true,optional = true}
url = {workspace = true,features = ["serde"],optional = true}
uuid = {workspace = true}
x25519-dalek = {workspace = true}
zeroize = {workspace = true,default-features = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmls = {workspace = true,optional = true}
# rt-multi-thread is required for tokio::task::block_in_place, which the
# sync HttpDidResolver facade uses to block safely on multi-thread runtimes.
# Native-only: the wasm32 build neither compiles http_did_resolver nor
# supports the multi-thread scheduler.
tokio = {workspace = true,features = ["rt-multi-thread"],optional = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = {workspace = true,features = ["js"],optional = true}

[dev-dependencies]
tokio = {workspace = true,features = ["macros", "rt", "rt-multi-thread"]}

[[example]]
name = "basic_authenticated_client"
required-features = ["full-surface"]

[[example]]
name = "durable_sync_client"
required-features = ["full-surface"]

[[example]]
name = "encrypted_messaging_workflow"
required-features = ["full-surface"]

[[example]]
name = "media_roundtrip"
required-features = ["full-surface"]

[[example]]
name = "personal_agent_provision"
required-features = ["full-surface", "signer"]

[[test]]
name = "sdk_workflows"
required-features = ["full-surface"]

[[test]]
name = "umbrella_smoke"
required-features = ["full-surface"]

[lints]
workspace = true
