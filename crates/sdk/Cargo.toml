[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Arkret v1 decentralized collaboration protocol SDK."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "did", "sdk"]
license = "Apache-2.0"
name = "arkret"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
client = ["dep:arkret-http-client", "dep:reqwest", "dep:tokio", "dep:url"]
signer = ["arkret-signatures/signer"]
server = ["dep:arkret-server"]
mls = ["dep:arkret-mls"]
# TLS backend passthrough (`cargo add arkret --features client,tls-rustls`
# gives a working https client out of the box). The SDK stays TLS-neutral
# without this feature. PQ-hybrid TLS (X25519MLKEM768) is a MUST for all
# profiles per arkret-spec transport-bindings section 5 — see the
# arkret-http-client crate docs for the recommended provider configuration.
tls-rustls = ["client", "arkret-http-client/tls-rustls", "reqwest/rustls"]
tracing = ["dep:tracing", "arkret-http-client?/tracing"]
salvo = [
    "server",
    "dep:salvo",
    "salvo/oapi",
    "arkret-server/salvo",
    "arkret-identifiers/salvo",
    "arkret-event-draft/salvo-oapi",
    "arkret-wire/salvo-oapi",
    "arkret-models-identity/salvo-oapi",
    "arkret-models-collaboration/salvo-oapi",
    "arkret-models-crypto/salvo-oapi",
    "arkret-models-discovery/salvo-oapi",
    "arkret-models-integration/salvo-oapi",
    "arkret-schema/salvo-oapi",
    "arkret-policy/salvo-oapi",
    "arkret-state/salvo",
    # The applet transactions handler verifies signatures / resolves DIDs on
    # the blocking pool (tokio::task::spawn_blocking).
    "dep:tokio",
]
# Round 23 (2026-05-09): expose the platform KeyStore feature gates so apps
# embedding the umbrella `arkret` crate can opt into OS-native key storage
# without a direct arkret-keystore dependency.
keystore-macos = ["arkret-keystore/keystore-macos"]
keystore-linux = ["arkret-keystore/keystore-linux"]
keystore-windows = ["arkret-keystore/keystore-windows"]
keystore-encrypted-file = ["arkret-keystore/keystore-encrypted-file"]

[dependencies]

# openmls is split per-target because the upstream crate hard-requires the
# `js` cargo feature on wasm32 (it pulls fluvio_wasm_timer + js-sys for time
# and randomness). Native targets must NOT enable `js` (no js-sys available).
arkret-auth = {workspace = true}
arkret-bootstrap = {workspace = true}
arkret-canonical = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
arkret-crypto = {workspace = true,features = ["account-data", "aead", "identity-root"]}
arkret-event-draft = {workspace = true}
arkret-hlc = {workspace = true}
arkret-identifiers = {workspace = true}
# Direct dep so the SDK crypto store can re-export the MLS record shapes
# (`MlsGroupStateRecord`) it previously owned; the shapes now live in
# arkret-models-crypto. The umbrella crate is layering-exempt.
arkret-models-crypto = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-discovery = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-models = {workspace = true}
arkret-http-client = {workspace = true,optional = true}
arkret-identity = {workspace = true}
arkret-keystore = {workspace = true}
arkret-lattice-registry = {workspace = true}
arkret-egress-policy = {workspace = true}
arkret-mls = {workspace = true,optional = true}
arkret-policy = {workspace = true}
arkret-schema = {workspace = true}
arkret-server = {workspace = true,optional = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-state = {workspace = true}
arkret-wire = {workspace = true}
reqwest = {workspace = true,features = ["json", "gzip", "http2"],optional = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true,features = ["rt", "macros"],optional = true}
tracing = {workspace = true,optional = true}
url = {workspace = true,features = ["serde"],optional = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# rt-multi-thread is required for tokio::task::block_in_place, which the
# sync HttpDidResolver facade uses to block safely on multi-thread runtimes.
# Native-only: the wasm32 build neither compiles http_did_resolver nor
# supports the multi-thread scheduler.
tokio = {workspace = true,features = ["rt-multi-thread"],optional = true}

[dev-dependencies]
tokio = {workspace = true,features = ["macros", "rt", "rt-multi-thread"]}

[lints]
workspace = true
