[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
description = "Framework-independent Cokret v1 server protocol contracts."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "server", "protocol", "sdk"]
license = "Apache-2.0"
name = "cokret-server"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["cokret-core/salvo"]

[dependencies]
cokret-contracts.workspace = true
cokret-core.workspace = true
cokret-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
