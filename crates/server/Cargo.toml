[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
description = "Framework-independent Arkret v1 server protocol contracts."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "server", "protocol", "sdk"]
license = "Apache-2.0"
name = "arkret-server"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = [
    "arkret-state/salvo",
    "arkret-wire/salvo-oapi",
    "arkret-event-draft/salvo-oapi",
    "arkret-models-identity/salvo-oapi",
    "arkret-models-crypto/salvo-oapi",
    "arkret-models-collaboration/salvo-oapi",
    "arkret-models-discovery/salvo-oapi",
    "arkret-models-integration/salvo-oapi",
    "dep:salvo",
    "dep:tokio",
]

[dependencies]
arkret-canonical = {workspace = true}
arkret-event-draft = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-discovery = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-wire = {workspace = true}
arkret-signatures.workspace = true
arkret-state = {workspace = true}
chrono = {workspace = true}
salvo = {workspace = true,features = ["affix-state", "oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true,features = ["rt"],optional = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}

[lints]
workspace = true
