[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
description = "Framework-independent Contrix v1 server endpoint registry and OpenAPI helpers."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "server", "openapi", "sdk"]
license = "Apache-2.0"
name = "contrix-server"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.7.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["contrix-core/salvo"]

[dependencies]
contrix-api.workspace = true
contrix-core.workspace = true
contrix-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true

[lints]
workspace = true
