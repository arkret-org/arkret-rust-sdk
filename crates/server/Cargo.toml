[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
description = "Framework-independent Arkret v1 server protocol contracts."
edition = "2024"
homepage = "https://github.com/arkret/arkret-rust-sdk"
keywords = ["arkret", "server", "protocol", "sdk"]
license = "Apache-2.0"
name = "arkret-server"
readme = "README.md"
repository = "https://github.com/arkret/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["arkret-core/salvo"]

[dependencies]
arkret-core = {workspace = true}
arkret-signatures = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}

[lints]
workspace = true
