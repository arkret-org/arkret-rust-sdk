[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Framework-independent Contrix v1 server endpoint registry and OpenAPI helpers."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "server", "openapi", "sdk"]
license = "Apache-2.0"
name = "contrix-server"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.1.0"

[features]
default = []
salvo = ["dep:salvo", "dep:url"]

[dependencies]
contrix-core.workspace = true
salvo = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, optional = true }

[lints]
workspace = true
