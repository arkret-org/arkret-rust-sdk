[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["algorithms", "data-structures"]
description = "Arkret v1 Move/Seal state resolution and snapshot runtime."
edition = "2024"
homepage = "https://github.com/arkret/arkret-rust-sdk"
keywords = ["arkret", "state", "snapshot", "protocol"]
license = "Apache-2.0"
name = "arkret-state"
readme = "README.md"
repository = "https://github.com/arkret/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
salvo = ["arkret-wire-base/salvo-oapi", "dep:salvo"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-wire-base = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
hex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}

[lints]
workspace = true
