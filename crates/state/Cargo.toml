[package]
authors.workspace = true
categories = ["algorithms", "data-structures"]
description = "Arkret v1 authority-commit stream persistence runtime."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "state", "snapshot", "protocol"]
license.workspace = true
name = "arkret-state"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
openapi = [
    "dep:salvo-oapi",
    "arkret-identifiers/openapi",
    "arkret-wire/openapi",
    "salvo-oapi/chrono",
]

[dependencies]
arkret-identifiers = { workspace = true }
arkret-wire = { workspace = true }
salvo-oapi = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
arkret-canonical = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
chrono = { workspace = true }

[lints]
workspace = true
