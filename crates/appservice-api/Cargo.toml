[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 appservice, bot, and bridge protocol API models."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "appservice", "bot", "bridge"]
license = "Apache-2.0"
name = "contrix-appservice-api"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.5.1"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true

[lints]
workspace = true
