[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures", "encoding"]
description = "Core Cokret v1 protocol types, canonical JSON, cursors, sync models, and service metadata."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "collaboration", "did", "protocol"]
license = "Apache-2.0"
name = "cokret-core"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Client-side URL handling + the transport-agnostic `Error::Http`/`Error::Url`
# variants. Deliberately does NOT pull in a concrete HTTP stack — reqwest
# lives in cokret-http-client (ARCHITECTURE.md: core is the wire-model layer).
client = ["dep:url"]
mls = []
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono", "cokret-identifiers/salvo"]

[dependencies]
base64.workspace = true
bs58.workspace = true
chrono = { workspace = true, features = ["serde"] }
cokret-identifiers.workspace = true
getrandom.workspace = true
regex.workspace = true
salvo = { workspace = true, optional = true, features = ["oapi"] }
salvo-oapi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# T8.2 § property tests for blind payload sanitizer / canonical JSON.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
