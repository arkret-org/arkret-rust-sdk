[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures", "encoding"]
description = "Core Arkret v1 protocol types, canonical JSON, cursors, sync models, and service metadata."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "did", "protocol"]
license = "Apache-2.0"
name = "arkret-core"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
embedded-artifacts = ["arkret-schema/embedded-artifacts"]
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono", "arkret-identifiers/salvo", "arkret-hlc/salvo", "arkret-event-draft/salvo-oapi", "arkret-wire/salvo-oapi", "arkret-models-identity/salvo-oapi", "arkret-models-collaboration/salvo-oapi", "arkret-models-crypto/salvo-oapi", "arkret-models-discovery/salvo-oapi", "arkret-models-integration/salvo-oapi", "arkret-schema/salvo-oapi", "arkret-policy/salvo-oapi"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-event-draft = {workspace = true}
arkret-hlc = {workspace = true}
# Transitional (phase 2-b): the KeyStore contract moved to arkret-keystore;
# core re-exports it until the facade retires (phase 5).
arkret-keystore = {workspace = true}
arkret-signatures = {workspace = true}
arkret-identity = {workspace = true}
arkret-auth = {workspace = true}
arkret-policy = {workspace = true}
arkret-schema = {workspace = true}
arkret-state = {workspace = true}
arkret-wire = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-discovery = {workspace = true}
arkret-models-integration = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
chrono-tz = {workspace = true}
arkret-identifiers = {workspace = true}
getrandom = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
regex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
salvo-oapi = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
unicode-normalization = {workspace = true}
zeroize = {workspace = true,default-features = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
# T8.2 § property tests for blind payload sanitizer / canonical JSON.
proptest = {workspace = true,default-features = false,features = ["std"]}
serde_json = {workspace = true}
# SDK-SOTA-03 microbenchmarks (run on demand with `cargo bench`, never in CI).
criterion = {workspace = true}

[[bench]]
harness = false
name = "canonical"

[lints]
workspace = true
