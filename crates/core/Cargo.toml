[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures", "encoding"]
description = "Core Arkret v1 protocol types, canonical JSON, cursors, sync models, and service metadata."
edition = "2024"
homepage = "https://github.com/arkret/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "did", "protocol"]
license = "Apache-2.0"
name = "arkret-core"
readme = "README.md"
repository = "https://github.com/arkret/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Client-side URL handling + the transport-agnostic `Error::Http`/`Error::Url`
# variants. Deliberately does NOT pull in a concrete HTTP stack — reqwest
# lives in arkret-http-client (ARCHITECTURE.md: core is the wire-model layer).
client = ["dep:url"]
mls = ["arkret-policy/mls"]
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono", "arkret-identifiers/salvo", "arkret-wire-base/salvo-oapi", "arkret-wire-edge/salvo-oapi", "arkret-schema/salvo-oapi", "arkret-policy/salvo-oapi"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-policy = {workspace = true}
arkret-schema = {workspace = true}
arkret-state = {workspace = true}
arkret-wire-base = {workspace = true}
arkret-wire-edge = {workspace = true}
base64 = {workspace = true}
blake3 = {workspace = true}
bs58 = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
chrono-tz = {workspace = true}
arkret-identifiers = {workspace = true}
getrandom = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
regex = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
salvo-oapi = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
subtle = {workspace = true}
tracing = {workspace = true}
unicode-normalization = {workspace = true}
url = {workspace = true,optional = true}
zeroize = {workspace = true,default-features = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
# T8.2 § property tests for blind payload sanitizer / canonical JSON.
proptest = {workspace = true,default-features = false,features = ["std"]}
serde_json = {workspace = true}
# SDK-SOTA-03 microbenchmarks (run on demand with `cargo bench`, never in CI).
criterion = {workspace = true}

[[bench]]
harness = false
name = "canonical"

[lints]
workspace = true
