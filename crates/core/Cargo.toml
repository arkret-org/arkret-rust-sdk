[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures", "encoding"]
description = "Core Arkret v1 protocol types, canonical JSON, cursors, sync models, and service metadata."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "collaboration", "did", "protocol"]
license = "Apache-2.0"
name = "arkret-core"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
salvo = ["arkret-identifiers/salvo", "arkret-event-draft/salvo-oapi", "arkret-wire/salvo-oapi", "arkret-models-identity/salvo-oapi", "arkret-models-collaboration/salvo-oapi", "arkret-models-crypto/salvo-oapi", "arkret-models-discovery/salvo-oapi", "arkret-models-integration/salvo-oapi", "arkret-schema/salvo-oapi", "arkret-policy/salvo-oapi"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-event-draft = {workspace = true}
arkret-signatures = {workspace = true}
arkret-identity = {workspace = true}
arkret-auth = {workspace = true}
arkret-policy = {workspace = true}
arkret-schema = {workspace = true}
arkret-state = {workspace = true}
arkret-wire = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-discovery = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-identifiers = {workspace = true}

[lints]
workspace = true
