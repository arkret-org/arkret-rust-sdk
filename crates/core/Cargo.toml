[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures", "encoding"]
description = "Core Contrix v1 protocol types, canonical JSON, cursors, sync models, and service metadata."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "collaboration", "did", "protocol"]
license = "Apache-2.0"
name = "contrix-core"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.7.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
client = ["dep:reqwest", "dep:url"]
mls = []
salvo = ["dep:salvo", "salvo/oapi", "dep:salvo-oapi", "salvo-oapi/chrono", "contrix-identifiers/salvo"]
# Platform KeyStore native backends. Each pulls its target-specific dep
# only on the matching target_os via `[target.*]` blocks below, so
# enabling all three on a non-matching host is a no-op for that backend.
keystore-macos = ["dep:security-framework"]
keystore-linux = ["dep:secret-service"]
keystore-windows = ["dep:windows"]

[dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
contrix-identifiers.workspace = true
reqwest = { workspace = true, optional = true }
salvo = { workspace = true, optional = true, features = ["oapi"] }
salvo-oapi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
