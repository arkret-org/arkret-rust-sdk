[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 service description, capability advertisement, and discovery models."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "discovery", "service", "wire"]
license = "Apache-2.0"
name = "arkret-models-discovery"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# OpenAPI `ToSchema` derives on the discovery/service-description wire types.
# Off by default so the data-layer graph stays framework-free; service crates
# opt in.
openapi = [
    "dep:salvo-oapi",
    "arkret-models-identity/openapi",
    "arkret-wire/openapi",
    "salvo-oapi/chrono",
]

[dependencies]
arkret-canonical = { workspace = true }
arkret-models-identity = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
curve25519-dalek = { workspace = true }
salvo-oapi = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
voprf = { workspace = true }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-models-integration = { workspace = true }
arkret-schema = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
