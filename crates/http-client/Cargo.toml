[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming"]
description = "HTTP transport bindings for Arkret v1 service endpoints."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "client", "http", "sdk"]
license = "Apache-2.0"
name = "arkret-http-client"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
tracing = ["dep:tracing"]
# Convenience TLS backend passthrough: enables reqwest's rustls backend so a
# fresh downstream gets a working https client out of the box. This crate
# stays TLS-neutral by default (downstream services pick their own backend /
# crypto provider). NOTE: arkret-spec transport-bindings section 5 makes
# PQ-hybrid TLS (X25519MLKEM768) a MUST for ALL profiles, fail-closed — see
# the crate docs for the recommended rustls provider configuration.
tls-rustls = ["reqwest/rustls"]

[dependencies]
chrono = {workspace = true,features = ["serde"]}
arkret-core = {workspace = true,features = ["client"]}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-wire = {workspace = true}
arkret-state = {workspace = true}
futures-util = {workspace = true,default-features = false,features = ["std"]}
reqwest = {workspace = true,features = ["json", "gzip", "http2", "multipart", "stream"]}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true,features = ["time"]}
tokio-util = {workspace = true,default-features = false,features = ["codec"]}
tracing = {workspace = true,optional = true}
url = {workspace = true,features = ["serde"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = {workspace = true}
# Native-only: consumed exclusively by `http_did_resolver` (reqwest + Tokio DID
# resolver), which is itself gated out on wasm32.
arkret-identity = {workspace = true}
# rt-multi-thread is required for tokio::task::block_in_place, which the sync
# HttpDidResolver facade uses to block safely on multi-thread runtimes; sync
# for OnceCell single-flight; rt for the current-thread fallback driver.
tokio = {workspace = true,features = ["rt", "rt-multi-thread", "sync"]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = {workspace = true,features = ["macros", "rt", "net", "io-util"]}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = {workspace = true}

[lints]
workspace = true
