[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming"]
description = "HTTP transport bindings for Cokret v1 service endpoints."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "client", "http", "sdk"]
license = "Apache-2.0"
name = "cokret-http-client"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
chrono = {workspace = true,features = ["serde"]}
cokret-core = {workspace = true,features = ["client"]}
cokret-signatures = {workspace = true}
futures-util = {workspace = true,default-features = false,features = ["std"]}
reqwest = {workspace = true,features = ["json", "gzip", "http2", "stream"]}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true,features = ["time"]}
tokio-util = {workspace = true,default-features = false,features = ["codec"]}
tracing = {workspace = true,optional = true}
url = {workspace = true,features = ["serde"]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = {workspace = true,features = ["macros", "rt", "net", "io-util"]}

[lints]
workspace = true
