[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["algorithms", "data-structures"]
description = "Arkret v1 authorization constraints and profile policy semantics."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "authorization", "policy"]
license = "Apache-2.0"
name = "arkret-policy"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
mls = []
salvo-oapi = ["dep:salvo", "salvo/oapi", "arkret-wire/salvo-oapi"]

[dependencies]
arkret-canonical = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-schema = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
chrono-tz = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}

[lints]
workspace = true
