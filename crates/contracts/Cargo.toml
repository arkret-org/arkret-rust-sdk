[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 shared wire contracts, product surface DTOs, and helper models."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "contracts", "protocol", "sdk"]
license = "Apache-2.0"
name = "cokret-contracts"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
salvo = [
    "dep:salvo",
    "salvo/oapi",
    "dep:salvo-oapi",
    "salvo-oapi/chrono",
    "cokret-core/salvo",
]

[dependencies]
chrono = {workspace = true}
cokret-core = {workspace = true}
cokret-crypto = {workspace = true}
cokret-html = {workspace = true}
cokret-signatures = {workspace = true}
salvo = {workspace = true,features = ["oapi"],optional = true}
salvo-oapi = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
tracing = {workspace = true}

[lints]
workspace = true
