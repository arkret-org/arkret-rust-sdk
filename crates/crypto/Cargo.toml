[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "contrix-crypto"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version.workspace = true
version = "0.2.0"

[features]
default = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
contrix-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
