[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "arkret-crypto"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# MLS-Exporter AEAD nonce derivation + encrypted-envelope AAD digest helpers
# (`aead_nonce` module). Pulls in HKDF-SHA256 and constant-time comparison;
# kept behind a feature so the bare `arkret-crypto` types crate stays light.
aead = ["dep:hkdf", "dep:subtle"]
# Principal-private Account Data value sealing (`account_data_crypto` module):
# XChaCha20-Poly1305 + HKDF-SHA256 over canonical JSON. Pulls in the AEAD/KDF
# stack and `regex` (canonical data-type validation) only when enabled.
account-data = ["dep:chacha20poly1305", "dep:getrandom", "dep:hkdf", "dep:regex"]
# Encrypted attachment codec (`blob_aead` module): `ak.blob.stream_aead.v1`
# chunked streaming AEAD + `ak.blob.whole_file_aead.v1` whole-file AEAD, both
# XChaCha20-Poly1305. Pulls in the AEAD stack only when enabled.
blob-aead = ["dep:chacha20poly1305", "dep:getrandom"]
# SFrame media frame-key / recording-key derivation (`sframe` module): the
# `MlsExporterSource` trait + fixed-label context builders over canonical JSON.
# Only needs zeroize for the returned key material; the MLS exporter impl lives
# in `arkret-mls`.
sframe = ["dep:zeroize"]
# Stateless key-verification crypto (`key_verification` module): X25519 SAS key
# agreement, HKDF/HMAC SAS derivation, and the `accept.commitment` hash. The
# typed strand state machine and envelopes stay in the SDK.
key-verification = [
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:x25519-dalek",
    "dep:zeroize",
]
# HPKE base-mode secret-share sealing (`secret_share` module): RFC 9180
# single-shot seal/open + the typed `ak.secret.*` to-device content bodies.
# Pulls in the `hpke` stack (`hpke`, `getrandom`, `rand_core` 0.9) only when
# enabled.
secret-share = ["dep:hpke", "dep:getrandom", "dep:rand_core_09"]
# Client-side key-backup helpers: Argon2id KDF + XChaCha20-Poly1305 AEAD +
# typed `ak.schema.key_backup.v1` envelope builder + recovery-key codec.
# Spec: crypto-media/key-management.md §7. Pulls in `argon2`,
# `chacha20poly1305`, `getrandom`, and HKDF/HMAC only when enabled
# so the bare `arkret-crypto` types crate stays light.
backup = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:zeroize",
]
identity-root = [
    "dep:bip39",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:hpke",
    "dep:zeroize",
]

[dependencies]
arkret-canonical = {workspace = true}
argon2 = {workspace = true,default-features = false,features = ["alloc"],optional = true}
bip39 = {workspace = true,optional = true}
chacha20poly1305 = {workspace = true,optional = true}
chrono = {workspace = true,features = ["serde"]}
arkret-models-crypto = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-wire = {workspace = true}
ed25519-dalek = {workspace = true,optional = true}
getrandom = {workspace = true,optional = true}
hkdf = {workspace = true,optional = true}
hmac = {workspace = true,optional = true}
hpke = {workspace = true,optional = true}
rand_core_09 = {workspace = true,optional = true}
regex = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true,optional = true}
thiserror = {workspace = true}
x25519-dalek = {workspace = true,optional = true}
zeroize = {workspace = true,optional = true}

[lints]
workspace = true

[[example]]
name = "dump_key_backup_kat"
required-features = ["backup"]

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
hex = {workspace = true}
