[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "arkret-crypto"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# MLS-Exporter AEAD nonce derivation + encrypted-envelope AAD digest helpers
# (`aead_nonce` module). Pulls in HKDF-SHA256 and constant-time comparison;
# kept behind a feature so the bare `arkret-crypto` types crate stays light.
aead = ["dep:hkdf", "dep:subtle"]
# Principal-private Account Data value sealing (`account_data_crypto` module):
# XChaCha20-Poly1305 + HKDF-SHA256 over canonical JSON. Pulls in the AEAD/KDF
# stack only when enabled.
account-data = ["dep:chacha20poly1305", "dep:getrandom", "dep:hkdf"]
# Encrypted attachment codec (`blob_aead` module): `ak.blob.stream_aead.v1`
# chunked streaming AEAD + `ak.blob.whole_file_aead.v1` whole-file AEAD, both
# XChaCha20-Poly1305. Pulls in the AEAD stack only when enabled.
blob-aead = ["dep:chacha20poly1305", "dep:getrandom", "dep:arkret-models-collaboration"]
# SFrame media frame-key / recording-key derivation (`sframe` module): the
# `MlsExporterSource` trait + fixed-label context builders over canonical JSON.
# Only needs zeroize for the returned key material; the MLS exporter impl lives
# in `arkret-mls`.
sframe = ["dep:zeroize"]
# RFC 9180 X25519 base-mode seal/open helpers used by backup protocols.
hpke = ["dep:hpke", "dep:getrandom"]
# Client-side key-backup primitives: Argon2id KDF + XChaCha20-Poly1305 AEAD +
# recovery-key codec. Envelope assembly remains in the authorization layer.
# Spec: crypto-media/key-management.md §7. Pulls in `argon2`,
# `chacha20poly1305`, `getrandom`, and HKDF/HMAC only when enabled
# so the bare `arkret-crypto` types crate stays light.
backup = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:zeroize",
]
identity-root = [
    "dep:bip39",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hpke",
    "dep:zeroize",
]

[dependencies]
argon2 = { workspace = true, default-features = false, features = ["alloc"], optional = true }
arkret-canonical = { workspace = true }
arkret-models-collaboration = { workspace = true, optional = true }
arkret-models-crypto = { workspace = true }
arkret-signatures.workspace = true
arkret-wire = { workspace = true }
bip39 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hpke = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-schema = { workspace = true }

[lints]
workspace = true

[[example]]
name = "dump_key_backup_kat"
required-features = ["backup"]
