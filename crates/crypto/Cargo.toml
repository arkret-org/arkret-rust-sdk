[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Cokret v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/cokret/cokret-rust-sdk"
keywords = ["cokret", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "cokret-crypto"
readme = "README.md"
repository = "https://github.com/cokret/cokret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# Client-side key-backup helpers: Argon2id KDF + XChaCha20-Poly1305 AEAD +
# typed `ck.schema.key_backup.v1` envelope builder + recovery-key codec.
# Spec: crypto-media/key-management.md §7. Pulls in `argon2`,
# `chacha20poly1305`, `base64`, `getrandom`, `anyhow` only when enabled
# so the bare `cokret-crypto` types crate stays light.
backup = [
    "dep:anyhow",
    "dep:argon2",
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:zeroize",
]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
cokret-core.workspace = true
cokret-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Feature-gated client crypto for key-backup envelopes.
anyhow = { version = "1.0", optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[lints]
workspace = true
