[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Arkret v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "arkret-crypto"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
# MLS-Exporter AEAD nonce derivation + encrypted-envelope AAD digest helpers
# (`aead_nonce` module). Only pulls in HKDF-SHA256; kept behind a feature so the
# bare `arkret-crypto` types crate stays light.
aead = ["dep:hkdf"]
# HPKE base-mode secret-share sealing (`secret_share` module): RFC 9180
# single-shot seal/open + the typed `ak.secret.*` to-device content bodies.
# Pulls in the `hpke` stack (`hpke`, `getrandom`, `rand_core` 0.9) only when
# enabled.
secret-share = ["dep:hpke", "dep:getrandom", "dep:rand_core_09"]
# Client-side key-backup helpers: Argon2id KDF + XChaCha20-Poly1305 AEAD +
# typed `ak.schema.key_backup.v1` envelope builder + recovery-key codec.
# Spec: crypto-media/key-management.md §7. Pulls in `argon2`,
# `chacha20poly1305`, `getrandom`, and HKDF/HMAC only when enabled
# so the bare `arkret-crypto` types crate stays light.
backup = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:zeroize",
]
identity-root = [
    "dep:bip39",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:hpke",
    "dep:zeroize",
]

[dependencies]
arkret-canonical = {workspace = true}
argon2 = {workspace = true,default-features = false,features = ["alloc"],optional = true}
bip39 = {workspace = true,optional = true}
chacha20poly1305 = {workspace = true,optional = true}
chrono = {workspace = true,features = ["serde"]}
arkret-models-crypto = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-signatures = {workspace = true,features = ["protocol"]}
arkret-wire = {workspace = true}
ed25519-dalek = {workspace = true,optional = true}
getrandom = {workspace = true,optional = true}
hkdf = {workspace = true,optional = true}
hmac = {workspace = true,optional = true}
hpke = {workspace = true,optional = true}
rand_core_09 = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
zeroize = {workspace = true,optional = true}

[lints]
workspace = true

[[example]]
name = "dump_key_backup_kat"
required-features = ["backup"]

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
hex = {workspace = true}
