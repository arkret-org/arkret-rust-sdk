[package]
authors = ["Chris Young <chris@sonc.ai>"]
description = "Contrix v1 protocol crypto machine contracts."
edition = "2024"
homepage = "https://github.com/contrix/contrix-rust-sdk"
keywords = ["contrix", "crypto", "e2ee", "backup"]
license = "Apache-2.0"
name = "contrix-crypto"
readme = "README.md"
repository = "https://github.com/contrix/contrix-rust-sdk"
rust-version = "1.92"
version = "0.8.0-rc1"

[features]
default = []
# Client-side key-backup helpers: Argon2id KDF + XChaCha20-Poly1305 AEAD +
# typed `cx.schema.key_backup.v1` envelope builder + recovery-key codec.
# Spec: crypto-media/key-management.md §7. Pulls in `argon2`,
# `chacha20poly1305`, `base64`, `getrandom`, `anyhow` only when enabled
# so the bare `contrix-crypto` types crate stays light.
backup = [
    "dep:anyhow",
    "dep:argon2",
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:getrandom",
]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contrix-core.workspace = true
contrix-signatures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Feature-gated client crypto for key-backup envelopes.
anyhow = { version = "1.0", optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[lints]
workspace = true
