[package]
authors.workspace = true
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 client-side drafting for minimal producer Events and local projections."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "operation", "draft", "protocol"]
license.workspace = true
name = "arkret-event-draft"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
test-support = ["arkret-wire/test-support"]
openapi = [
    "arkret-identifiers/openapi",
    "arkret-models-collaboration/openapi",
    "arkret-models-crypto/openapi",
    "arkret-models-identity/openapi",
    "arkret-models-integration/openapi",
    "arkret-wire/openapi",
]

[dependencies]
arkret-canonical = { workspace = true }
arkret-identifiers = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-crypto = { workspace = true }
arkret-models-identity = { workspace = true }
arkret-models-integration = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-schema = { workspace = true }
arkret-wire = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }

[lints]
workspace = true
