[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "data-structures"]
description = "Arkret v1 client-side event drafting: operation drafts, the operation envelope builder, the event-draft kind registry, and rank interval arithmetic."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "operation", "draft", "protocol"]
license = "Apache-2.0"
name = "arkret-event-draft"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[features]
default = []
test-support = ["arkret-wire/test-support"]
openapi = [
    "dep:salvo-oapi",
    "arkret-identifiers/openapi",
    "arkret-models-collaboration/openapi",
    "arkret-models-crypto/openapi",
    "arkret-models-identity/openapi",
    "arkret-models-integration/openapi",
    "arkret-wire/openapi",
    "salvo-oapi/chrono",
]

[dependencies]
arkret-canonical = {workspace = true}
arkret-identifiers = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-crypto = {workspace = true}
arkret-models-identity = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-wire = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
serde = {workspace = true}
serde_json = {workspace = true}
salvo-oapi = {workspace = true,optional = true}
thiserror = {workspace = true}

[dev-dependencies]
arkret-schema = {workspace = true,features = ["embedded-artifacts"]}
arkret-wire = {workspace = true,features = ["test-support"]}
serde_json = {workspace = true}

[lints]
workspace = true
