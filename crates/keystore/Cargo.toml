[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "cryptography", "os"]
description = "Durable encrypted-file and platform-native KeyStore backends for the Arkret v1 SDK."
edition = "2024"
homepage = "https://github.com/arkret-org/arkret-rust-sdk"
keywords = ["arkret", "keystore", "keychain", "secrets"]
license = "Apache-2.0"
name = "arkret-keystore"
readme = "README.md"
repository = "https://github.com/arkret-org/arkret-rust-sdk"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
keystore-encrypted-file = [
    "dep:atomic-write-file",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:hkdf",
    "dep:sha2",
    "dep:zeroize",
]
# Platform KeyStore native backends. Each pulls its target-specific dep
# only on the matching target_os via `[target.*]` blocks below, so
# enabling all three on a non-matching host is a no-op for that backend.
keystore-macos = ["dep:security-framework"]
keystore-linux = ["dep:secret-service"]
keystore-windows = ["dep:windows"]

[dependencies]
arkret-core = {workspace = true}
atomic-write-file = {workspace = true,optional = true}
chacha20poly1305 = {workspace = true,optional = true}
getrandom = {workspace = true,optional = true}
hkdf = {workspace = true,optional = true}
sha2 = {workspace = true,optional = true}
zeroize = {workspace = true,optional = true}

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = {workspace = true,optional = true}

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = {workspace = true,optional = true}

[target.'cfg(target_os = "windows")'.dependencies]
windows = {workspace = true,features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
],optional = true}

[lints]
workspace = true
