[package]
authors.workspace = true
categories = ["internationalization"]
description = "The single UI-locale vocabulary and resolution order shared by Arkret services and clients."
edition.workspace = true
homepage.workspace = true
keywords = ["arkret", "locale", "i18n", "bcp47"]
license.workspace = true
name = "arkret-locale"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# `Serialize`/`Deserialize` on `UiLocale`. Off by default so the crate stays
# dependency-free for callers that only need the parser; clients that persist
# the locale (inkson's translation dictionaries) opt in.
serde = ["dep:serde"]
# OpenAPI schema support stays opt-in alongside serialization so framework-free
# consumers retain the crate's dependency-free default graph.
openapi = ["serde", "dep:salvo-oapi"]

[dependencies]
salvo-oapi = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
