name: Release source packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: arkret-org/arkret-rust-sdk
    env:
      # Topologically sorted dependency order. Generated from
      # `cargo metadata --no-deps`; keep in sync with `RELEASING.md`.
      CRATES: >-
        arkret-canonical
        arkret-egress-policy
        arkret-egress-reqwest
        arkret-retry
        arkret-identifiers
        arkret-keystore
        arkret-locale
        arkret-wire
        arkret-hlc
        arkret-models-crypto
        arkret-models-identity
        arkret-schema
        arkret-models-collaboration
        arkret-models-discovery
        arkret-models-integration
        arkret-push-policy
        arkret-event-draft
        arkret-policy
        arkret-state
        arkret-signatures
        arkret-auth
        arkret-crypto
        arkret-identity
        arkret-mls
        arkret-http-client
        arkret-bootstrap
        arkret-rate-limit
        arkret-server
        arkret
    steps:
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          path: arkret-org/arkret-rust-sdk
      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: 8ae6fd0f14c630310a524e38b950b191918295e3
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/arkret-rust-sdk
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --exclude arkret-schema-conformance --exclude arkret-test-kit --exclude-lockfile --locked --no-verify
      - name: Package release sources
        run: python .ci/package-release.py --target source --crates
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: arkret-org/arkret-rust-sdk/release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
