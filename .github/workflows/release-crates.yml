name: Local package checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package workspace locally
    runs-on: ubuntu-latest
    env:
      # Topologically sorted dependency order. Generated from
      # `cargo metadata --no-deps`; keep in sync with `RELEASING.md`.
      CRATES: >-
        arkret-canonical
        arkret-egress-policy
        arkret-egress-reqwest
        arkret-retry
        arkret-identifiers
        arkret-keystore
        arkret-locale
        arkret-wire
        arkret-hlc
        arkret-models-identity
        arkret-models-crypto
        arkret-models-collaboration
        arkret-models-discovery
        arkret-models-integration
        arkret-push-policy
        arkret-event-draft
        arkret-schema
        arkret-policy
        arkret-state
        arkret-signatures
        arkret-auth
        arkret-crypto
        arkret-identity
        arkret-mls
        arkret-http-client
        arkret-lattice-registry
        arkret-bootstrap
        arkret-rate-limit
        arkret-server
        arkret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify
