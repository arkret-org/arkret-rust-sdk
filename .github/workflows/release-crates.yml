name: Local package checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package workspace locally
    runs-on: ubuntu-latest
    env:
      # Topologically sorted dependency order. Generated from
      # `cargo metadata --no-deps`; keep in sync with `RELEASING.md`.
      CRATES: >-
        contrix-identifiers
        contrix-core
        contrix-ffi
        contrix-html
        contrix-http-client
        contrix-signatures
        contrix-crypto
        contrix-api
        contrix-server
        contrix-testing
        contrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify
