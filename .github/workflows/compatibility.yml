name: atomic compatibility

on:
  workflow_dispatch:
    inputs:
      manifest_ref:
        description: Exact arkret-rust-sdk ref containing the candidate manifest
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: atomic-compatibility-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-manifest-gate:
    name: atomic compatibility / exact manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: arkret-org
    steps:
      - name: Checkout compatibility manifest source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: .compatibility-source
          persist-credentials: false
          ref: ${{ inputs.manifest_ref || github.sha }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Resolve the immutable candidate set
        working-directory: ${{ github.workspace }}
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/arkret-org"
          resolver_root="$RUNNER_TEMP/compatibility-resolver-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$resolver_root"
          mv -- "$GITHUB_WORKSPACE/.compatibility-source" "$resolver_root/manifest-source"
          gate_source="$resolver_root/manifest-source"
          sdk_source_sha="$(git -C "$gate_source" rev-parse --verify HEAD)"
          python "$gate_source/tools/compatibility_gate.py" resolve \
            --manifest "$gate_source/compatibility/manifest.json" \
            --candidate "arkret-rust-sdk=$sdk_source_sha" \
            --output "${{ runner.temp }}/resolved-compatibility-manifest.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve resolved manifest
        uses: actions/upload-artifact@v7
        with:
          name: resolved-compatibility-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/resolved-compatibility-manifest.json
          if-no-files-found: error

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: ${{ steps.manifest.outputs.arkret_spec }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-org/arkret-rust-sdk
          ref: ${{ steps.manifest.outputs.arkret_rust_sdk }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/floria
          path: arkret-org/floria
          ref: ${{ steps.manifest.outputs.floria }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: arkret-org/coland
          ref: ${{ steps.manifest.outputs.coland }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: arkret-org/coauth
          ref: ${{ steps.manifest.outputs.coauth }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garth
          path: arkret-org/garth
          ref: ${{ steps.manifest.outputs.garth }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chime
          path: arkret-org/chime
          ref: ${{ steps.manifest.outputs.chime }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inkson
          path: arkret-org/inkson
          ref: ${{ steps.manifest.outputs.inkson }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          ref: ${{ steps.manifest.outputs.cotest }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: arkret-org/bridges
          ref: ${{ steps.manifest.outputs.bridges }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/flagon
          path: arkret-org/flagon
          ref: ${{ steps.manifest.outputs.flagon }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: ${{ steps.manifest.outputs.savfox }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            arkret-org/arkret-rust-sdk
            arkret-org/coland
            arkret-org/coauth
            arkret-org/garth
            arkret-org/inkson
            arkret-org/cotest

      - name: Verify exact checkouts and static contract probes
        run: |
          python arkret-rust-sdk/tools/test_compatibility_gate.py --workspace-only
          python arkret-rust-sdk/tools/test_compatibility_train.py
          python arkret-rust-sdk/tools/compatibility_gate.py check             --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json"             --workspace-root .             --verify-workspace-heads
          python arkret-rust-sdk/tools/compatibility_gate.py negative-mutation             --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json"             --workspace-root .

      - name: Run ordered static checks
        run: >-
          python arkret-rust-sdk/tools/compatibility_gate.py run
          --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json"
          --workspace-root .
          --category static
          --report "${{ runner.temp }}/compatibility-check-reports/static.json"

      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev dbus-x11 gnome-keyring libsecret-tools

      - name: Run ordered compile matrix
        run: >-
          python arkret-rust-sdk/tools/compatibility_gate.py run
          --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json"
          --workspace-root .
          --category compile
          --report "${{ runner.temp }}/compatibility-check-reports/compile.json"

      - name: Install Dioxus CLI for the real Inkson web contract
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Install frontend task runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Cotest contract dependencies
        working-directory: arkret-org/cotest/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build exact Coland candidate image
        working-directory: arkret-org/cotest
        shell: pwsh
        run: ./scripts/build-coland-image.ps1 -ImageTag cotest-coland:compatibility

      - name: Prepare Linux joint prerequisites
        id: joint_prerequisites
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh setup

      - name: Run ordered wire and joint contract gates
        run: >-
          bash inkson/scripts/with-native-keystore.sh
          python arkret-rust-sdk/tools/compatibility_gate.py run
          --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json"
          --workspace-root .
          --category contract
          --report "${{ runner.temp }}/compatibility-check-reports/contract.json"

      - name: Preserve per-check compatibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-check-results-${{ github.run_id }}
          path: ${{ runner.temp }}/compatibility-check-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore Linux hosts permissions
        if: always() && steps.joint_prerequisites.outcome != 'skipped' && steps.joint_prerequisites.outcome != ''
        run: bash cotest/scripts/prepare-linux-joint-e2e.sh restore

      - name: Preserve joint failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-joint-evidence-${{ github.run_id }}
          path: arkret-org/cotest/artifacts/
          if-no-files-found: ignore
          retention-days: 14
