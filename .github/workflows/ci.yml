name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - name: Guard crate layering (frozen phase-0 exit review rules)
        run: python tools/check-layering.py
      - name: Guard protocol time representations
        run: python tools/lint-time-representations.py
      - name: Guard optional canonical timestamp defaults
        run: |
          python tools/test_lint_optional_timestamp_defaults.py
          python tools/lint-optional-timestamp-defaults.py
      - name: Guard registered cell-family constants
        run: python tools/lint-cell-family-literals.py
      - name: Guard hand-rolled Event digest preimages
        run: |
          python tools/test_lint_event_preimage_authoring.py
          python tools/lint-event-preimage-authoring.py
      # The audit runs against this repo here; the cross-repo inventory lives in
      # tools/event_derived_id_minting_allowlist.json and each downstream repo
      # runs `--root .` against the same file from its sibling checkout.
      - name: Audit event-derived id minting
        run: |
          python tools/test_lint_event_derived_id_minting.py
          python tools/lint-event-derived-id-minting.py
      - name: Guard weak wire types and closed-schema boundaries
        run: |
          python tools/test_identity_type_audit.py
          python tools/identity_type_audit.py
          python tools/tests/test_wire_value_audit.py
          python tools/wire_value_audit.py --check
          # Package-style imports (`from tools.deny_unknown_audit import ...`),
          # so it must be run as a module from the repo root, not as a script.
          python -m tools.test_deny_unknown_audit
          python tools/deny_unknown_audit.py --check
      - run: cargo check -p arkret
      - name: Guard default arkret dependency surface
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p arkret --edges normal > /tmp/arkret-default-tree.txt
          if grep -E '(^|[[:space:]])(openmls|reqwest|tokio|arkret-http-client|arkret-server) v' /tmp/arkret-default-tree.txt; then
            echo "default arkret feature pulled a heavy runtime dependency"
            exit 1
          fi
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features client
      - run: cargo check --no-default-features --features server
      - run: cargo check --no-default-features --features mls
      - run: cargo check --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      # No `export_openapi` step: this repo has never contained that example,
      # so the job failed at the cargo target-resolution stage on every run and
      # never reached anything it was meant to check. The SDK consumes the
      # spec's OpenAPI document (embedded as
      # crates/schema/src/embedded_openapi.yaml and drift-gated in the
      # spec-drift job) rather than producing its own; the `openapi` features on
      # arkret-wire / arkret-identifiers only add `ToSchema` derives for service
      # crates to assemble downstream, and `cargo check --all-features` above
      # already compiles them.

  downstream-matrix-gate:
    name: downstream compile matrix gate
    runs-on: ubuntu-latest
    # Public-surface changes under crates/wire or crates/models-* can break
    # downstream repositories that this repo's own `cargo check` never compiles
    # (indirect consumers reached through `arkret` re-exports). A cross-repo
    # compile job was evaluated and rejected (see CONTRIBUTING.md), so this
    # gate instead requires an explicit assertion: the PR body must contain
    # `compile-matrix: green` — added by the author after running
    # arkret-work/tools/check-workspace-compiles.ps1 — or
    # `compile-matrix: n/a` with a reason.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require matrix assertion on wire/models public surface changes
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -E '^crates/(wire|models-[^/]+)/src/.+\.rs$' || true)
          if [ -z "$changed" ]; then
            echo "no crates/wire or crates/models-* source changes; gate not triggered"
            exit 0
          fi
          echo "wire/models source files changed:"
          echo "$changed"
          if printf '%s' "$PR_BODY" | grep -qE 'compile-matrix:[[:space:]]*(green|n/a)'; then
            echo "compile matrix assertion present in PR body"
            exit 0
          fi
          echo "::error::This PR changes the wire/models public surface. Single-repo"
          echo "::error::\`cargo check\` cannot see indirect downstream consumers — run the"
          echo "::error::workspace compile matrix first:"
          echo "::error::  powershell -File arkret-work/tools/check-workspace-compiles.ps1"
          echo "::error::Then add 'compile-matrix: green' to the PR body (or"
          echo "::error::'compile-matrix: n/a — <reason>' if the change cannot affect"
          echo "::error::downstream compilation)."
          exit 1

  wasm:
    name: wasm32 checks
    runs-on: ubuntu-latest
    # The client and MLS surfaces support wasm32. Keep MLS in this job because
    # it is the workspace path that activates getrandom 0.3's wasm_js backend
    # through OpenMLS; checking only the client and identifier crates does not
    # exercise that RNG generation.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p arkret --target wasm32-unknown-unknown --no-default-features --features client
      - run: cargo check -p arkret-mls --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p arkret-identifiers --target wasm32-unknown-unknown --no-default-features

  embedded-snapshot:
    name: embedded spec snapshot drift gate
    runs-on: ubuntu-latest
    # Hard gate (SDK-TEST-07): the embedded spec artifact snapshot MUST match
    # the live spec. ARKRET_REQUIRE_SPEC=1 turns the otherwise-skipping test
    # into a failure when the spec checkout is missing, so this job can never
    # silently pass without comparing. Refresh every spec-derived SDK surface
    # with `./tools/sync-spec.ps1` when the spec moves.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Run embedded snapshot drift gate
        working-directory: arkret-rust-sdk
        env:
          ARKRET_REQUIRE_SPEC: "1"
          ARKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
        run: cargo test -p arkret-schema --lib embedded_spec_artifacts_match_live_spec_when_available

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          # Catch broken intra-doc links and missing-docs regressions early.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        run: cargo doc --no-deps --all-features --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned MSRV — bumping requires a workspace Cargo.toml change and
          # a CHANGELOG entry. Keeping a separate job documents the contract.
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `.deny.toml` at repo root drives the policy. Run all checks so
          # license, advisory, ban and source policies are all enforced.
          command: check
          arguments: --config .deny.toml

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --workspace --baseline-rev HEAD~1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --config tarpaulin.toml --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: true

  package-check:
    name: local package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify

  spec-drift:
    name: spec artifact drift report
    runs-on: ubuntu-latest
    # Hard gate: fails when the SDK-declared spec coverage drifts in either
    # direction, including active spec entries missing from ARTIFACT_BACKED_*.
    # R3 sync (spec @ b47ff6ec): coverage extended to the new agent event
    # kinds (ak.agent.draft.propose, ak.agent.action_request,
    # ak.agent.action_{approve,reject}), the ak.self.call.media.exchange.issue_token.v1
    # operation, and the new media-service-binding / accountable_to.strict_reject
    # profiles. See docs/architecture.md#spec-drift-coverage-ci for the runbook.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Verify embedded artifact generator
        working-directory: arkret-rust-sdk
        run: python tools/test_refresh_embedded_artifacts.py
      # Runs here rather than in the `rust` job: the test builds its fixtures by
      # copying real registry files out of the sibling arkret-spec checkout, so
      # it needs this job's two-repo layout.
      - name: Verify registry type generator
        working-directory: arkret-rust-sdk
        run: python tools/tests/test_generate_registry_types.py
      - name: Verify all spec-derived SDK surfaces
        working-directory: arkret-rust-sdk
        shell: pwsh
        run: |
          $artifacts = "${{ github.workspace }}/arkret-spec/spec/v1/artifacts"
          ./tools/test-utf8-byte-order.ps1
          ./tools/sync-spec.ps1 -ArtifactsDir $artifacts -Check
      - name: Verify claimable-profile operation coverage matrix
        working-directory: arkret-rust-sdk
        run: >-
          python tools/generate-operation-coverage-matrix.py --check
          --artifacts ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
      # Cross-checks the hand-maintained SUPPORTED_* coverage constants in
      # crates/schema/src/artifacts.rs against the live registries in both
      # directions. The example this invokes did not exist until 2026-08-01, so
      # despite the job being declared a hard gate it had never once executed —
      # see _review_code/review_code.md.
      - name: Run spec_drift_report
        working-directory: arkret-rust-sdk
        env:
          ARKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
        run: cargo run -p arkret-schema --example spec_drift_report
