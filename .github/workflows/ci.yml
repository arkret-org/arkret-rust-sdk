name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      # Event audits scan the SDK here. Downstream scans retain their own --root
      # scope and the shared event-derived identifier inventory.
      - name: Run manifest SDK structure, time and Event checks
        run: >-
          python tools/compatibility_gate.py run --workspace-root .. --category static
          --check sdk.layering-regression --check sdk.layering
          --check sdk.test-layout-regression --check sdk.test-layout
          --check sdk.time-representations
          --check sdk.optional-timestamp-defaults-regression --check sdk.optional-timestamp-defaults
          --check sdk.event-preimage-authoring-regression --check sdk.event-preimage-authoring
          --check sdk.event-derived-id-minting-regression --check sdk.event-derived-id-minting
          --report "${{ runner.temp }}/sdk-structure-time-event.json"
      - name: Preserve SDK structure, time and Event results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-structure-time-event-results
          path: ${{ runner.temp }}/sdk-structure-time-event.json
          if-no-files-found: ignore
      - name: Guard weak wire types and closed-schema boundaries
        run: |
          python tools/test_identity_type_audit.py
          python tools/identity_type_audit.py
          python tools/tests/test_wire_value_audit.py
          python tools/wire_value_audit.py --check
          # Package-style imports (`from tools.deny_unknown_audit import ...`),
          # so it must be run as a module from the repo root, not as a script.
          python -m tools.test_deny_unknown_audit
          python tools/deny_unknown_audit.py --check
      - name: Guard default arkret dependency surface
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p arkret --edges normal > /tmp/arkret-default-tree.txt
          if grep -E '(^|[[:space:]])(openmls|reqwest|tokio|arkret-http-client|arkret-server) v' /tmp/arkret-default-tree.txt; then
            echo "default arkret feature pulled a heavy runtime dependency"
            exit 1
          fi
      - name: Run manifest SDK native compile checks
        run: >-
          python tools/compatibility_gate.py run --workspace-root .. --category compile
          --check sdk.compile-default --check sdk.compile-no-default
          --check sdk.compile-client --check sdk.compile-server --check sdk.compile-mls
          --check sdk.compile
          --report "${{ runner.temp }}/sdk-native-compile.json"
      - name: Preserve SDK native compile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-native-compile-results
          path: ${{ runner.temp }}/sdk-native-compile.json
          if-no-files-found: ignore
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      # No `export_openapi` step: this repo has never contained that example,
      # so the job failed at the cargo target-resolution stage on every run and
      # never reached anything it was meant to check. The SDK consumes the
      # spec's OpenAPI document (embedded as
      # crates/schema/src/embedded_openapi.yaml and drift-gated in the
      # spec-drift job) rather than producing its own; the `openapi` features on
      # arkret-wire / arkret-identifiers only add `ToSchema` derives for service
      # crates to assemble downstream, and the manifest all-features compile check above
      # already compiles them.

  compatibility-manifest-authoring:
    name: compatibility manifest authoring gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manifest and negative mutation gate
        run: |
          python tools/compatibility_gate.py resolve \
            --manifest compatibility/manifest.json \
            --candidate "arkret-rust-sdk=${{ github.event.pull_request.head.sha }}" \
            --output "${{ runner.temp }}/resolved-compatibility-manifest.json"
          python tools/compatibility_gate.py negative-mutation \
            --manifest "${{ runner.temp }}/resolved-compatibility-manifest.json" \
            --workspace-root ..
      - name: Require a candidate manifest for public model changes
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -E '^crates/(wire|models-[^/]+)/src/.+\.rs$' || true)
          if [ -z "$changed" ]; then
            echo "no crates/wire or crates/models-* source changes; gate not triggered"
            exit 0
          fi
          echo "wire/models source files changed:"
          echo "$changed"
          if git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- compatibility/manifest.json; then
            echo "::error::Public SDK models changed without updating compatibility/manifest.json."
            echo "::error::Pin every coordinated consumer candidate before the atomic compatibility gate runs."
            exit 1
          else
            echo "candidate compatibility manifest changed"
            exit 0
          fi

  wasm:
    name: wasm32 checks
    runs-on: ubuntu-latest
    # The client and MLS surfaces support wasm32. Keep MLS in this job because
    # it is the workspace path that activates getrandom 0.3's wasm_js backend
    # through OpenMLS; checking only the client and identifier crates does not
    # exercise that RNG generation.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - name: Run manifest SDK browser compile checks
        run: >-
          python tools/compatibility_gate.py run --workspace-root .. --category compile
          --check sdk.compile-wasm-client --check sdk.compile-wasm-mls
          --check sdk.compile-wasm-identifiers
          --report "${{ runner.temp }}/sdk-wasm-compile.json"
      - name: Preserve SDK browser compile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-wasm-compile-results
          path: ${{ runner.temp }}/sdk-wasm-compile.json
          if-no-files-found: ignore

  generated-contracts:
    name: generated contract drift gate
    runs-on: ubuntu-latest
    # Hard gate: every committed typed descriptor MUST match the live spec.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Run generated contract drift gate
        working-directory: arkret-rust-sdk
        shell: pwsh
        run: ./tools/sync-spec.ps1 -ArtifactsDir ${{ github.workspace }}/arkret-spec/spec/v1/artifacts -Check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          # Catch broken intra-doc links and missing-docs regressions early.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        run: cargo doc --no-deps --all-features --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned MSRV — bumping requires a workspace Cargo.toml change and
          # a CHANGELOG entry. Keeping a separate job documents the contract.
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `.deny.toml` at repo root drives the policy. Run all checks so
          # license, advisory, ban and source policies are all enforced.
          command: check
          arguments: --config .deny.toml

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --workspace --baseline-rev HEAD~1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --config tarpaulin.toml --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: true

  package-check:
    name: local package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify

  spec-drift:
    name: spec artifact drift report
    runs-on: ubuntu-latest
    # Hard gate: fails when the SDK-declared spec coverage drifts in either
    # direction, including active spec entries missing from ARTIFACT_BACKED_*.
    # R3 sync (spec @ b47ff6ec): coverage extended to the new agent event
    # kinds (ak.agent.draft.propose, ak.agent.action_request,
    # ak.agent.action_{approve,reject}), the ak.self.call.media.exchange.issue_token.v1
    # operation, and the new media-service-binding / accountable_to.strict_reject
    # profiles. See CONTRIBUTING.md ("Coverage gates layered on top") for the
    # list of coverage gates and how to run them locally.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Verify Rust spec generator
        working-directory: arkret-rust-sdk
        run: cargo test --manifest-path tools/spec-codegen/Cargo.toml
      - name: Guard SDK wire struct fields against live Spec schemas
        working-directory: arkret-rust-sdk
        run: |
          python -m tools.test_schema_struct_gate
          python tools/schema_struct_gate.py --spec-root ${{ github.workspace }}/arkret-spec/spec/v1/artifacts/schemas
      - name: Verify all spec-derived SDK surfaces
        working-directory: arkret-rust-sdk
        shell: pwsh
        run: |
          $artifacts = "${{ github.workspace }}/arkret-spec/spec/v1/artifacts"
          ./tools/test-utf8-byte-order.ps1
          ./tools/sync-spec.ps1 -ArtifactsDir $artifacts -Check
      - name: Verify claimable-profile operation coverage matrix
        working-directory: arkret-rust-sdk
        run: >-
          python tools/generate-operation-coverage-matrix.py --check
          --artifacts ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
      # Cross-checks generated SDK coverage against the live registries in both
      # directions through the explicit conformance crate.
      - name: Run spec_drift_report
        working-directory: arkret-rust-sdk
        env:
          ARKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
        run: cargo run -p arkret-schema-conformance --example spec_drift_report
