name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features client
      - run: cargo check --no-default-features --features server
      - run: cargo check --no-default-features --features mls
      - run: cargo check --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo run --example export_openapi --features server

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          # Catch broken intra-doc links and missing-docs regressions early.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        run: cargo doc --no-deps --all-features --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned MSRV — bumping requires a workspace Cargo.toml change and
          # a CHANGELOG entry. Keeping a separate job documents the contract.
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `.deny.toml` at repo root drives the policy. Run all checks so
          # license, advisory, ban and source policies are all enforced.
          command: check
          arguments: --config .deny.toml --all-features

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --config tarpaulin.toml --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  publish-dry-run:
    name: crates.io dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      # Crate package name is `contrix` (workspace path is `crates/sdk`).
      - run: cargo publish -p contrix --dry-run --locked

  spec-drift:
    name: spec artifact drift report
    runs-on: ubuntu-latest
    # Best-effort informational job: prints any active spec event kinds the
    # SDK has not yet declared coverage for. Fails only on *hard* drift —
    # entries the SDK declares but the spec no longer ships.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: contrix-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: contrix-dev/contrix-spec
          path: contrix-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contrix-rust-sdk
      - name: Run spec_drift_report
        if: hashFiles('contrix-spec/spec/v1/artifacts/registry/schema-registry.json') != ''
        working-directory: contrix-rust-sdk
        env:
          CONTRIX_SPEC_ARTIFACTS: ${{ github.workspace }}/contrix-spec/spec/v1/artifacts
        run: cargo run --example spec_drift_report
