name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features client
      - run: cargo check --no-default-features --features server
      - run: cargo check --no-default-features --features mls
      - run: cargo check --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo run --example export_openapi --features server

  wasm:
    name: wasm32 checks
    runs-on: ubuntu-latest
    # CHANGELOG 0.7.0 claims wasm32 support for the client surface; this job
    # is the regression guard for that claim (previously CI checked no wasm
    # target at all).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p cokret-core --target wasm32-unknown-unknown --no-default-features --features client
      - run: cargo check -p cokret-identifiers --target wasm32-unknown-unknown --no-default-features

  embedded-snapshot:
    name: embedded spec snapshot drift gate
    runs-on: ubuntu-latest
    # Hard gate (SDK-TEST-07): the embedded spec artifact snapshot MUST match
    # the live spec. COKRET_REQUIRE_SPEC=1 turns the otherwise-skipping test
    # into a failure when the spec checkout is missing, so this job can never
    # silently pass without comparing. Refresh the snapshot with
    # `python tools/refresh-embedded-artifacts.py` when the spec moves.
    steps:
      - uses: actions/checkout@v4
        with:
          path: cokret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: cokret/cokret-spec
          path: cokret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cokret-rust-sdk
      - name: Run embedded snapshot drift gate
        working-directory: cokret-rust-sdk
        env:
          COKRET_REQUIRE_SPEC: "1"
          COKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/cokret-spec/spec/v1/artifacts
        run: cargo test -p cokret-core --lib embedded_spec_artifacts_match_live_spec_when_available

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          # Catch broken intra-doc links and missing-docs regressions early.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        run: cargo doc --no-deps --all-features --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned MSRV — bumping requires a workspace Cargo.toml change and
          # a CHANGELOG entry. Keeping a separate job documents the contract.
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # Both ignored advisories are tracked release exceptions with no
        # upstream upgrade path: `instant` is wasm-only via OpenMLS's timer
        # dependency, and `libcrux-chacha20poly1305` is only present through
        # hpke-rs's optional libcrux backend while the SDK uses RustCrypto HPKE.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2026-0124

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `.deny.toml` at repo root drives the policy. Run all checks so
          # license, advisory, ban and source policies are all enforced.
          command: check
          arguments: --config .deny.toml

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --workspace --baseline-rev HEAD~1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --config tarpaulin.toml --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  package-check:
    name: local package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify

  spec-drift:
    name: spec artifact drift report
    runs-on: ubuntu-latest
    # Best-effort informational job: prints any active spec event kinds the
    # SDK has not yet declared coverage for. Fails only on *hard* drift —
    # entries the SDK declares but the spec no longer ships.
    # R3 sync (spec @ b47ff6ec): coverage extended to the new agent event
    # kinds (ck.agent.draft.propose, ck.agent.action_request,
    # ck.agent.action_{approve,reject}), the ck.self.call.media.exchange.issue_token
    # operation, and the new media-service-binding / accountable_to.strict_reject
    # profiles. See docs/architecture.md#spec-drift-coverage-ci for the runbook.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: cokret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: cokret/cokret-spec
          path: cokret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cokret-rust-sdk
      - name: Run spec_drift_report
        if: hashFiles('cokret-spec/spec/v1/artifacts/registry/schema-registry.json') != ''
        working-directory: cokret-rust-sdk
        env:
          COKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/cokret-spec/spec/v1/artifacts
        run: cargo run --example spec_drift_report
