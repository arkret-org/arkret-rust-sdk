name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - name: Guard crate layering (frozen phase-0 exit review rules)
        run: python tools/check-layering.py
      - name: Guard protocol time representations
        run: python tools/lint-time-representations.py
      - name: Guard weak wire types and closed-schema boundaries
        run: |
          python tools/wire_value_audit.py --check
          python tools/deny_unknown_audit.py --check
      - run: cargo check -p arkret
      - name: Guard default arkret dependency surface
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p arkret --edges normal > /tmp/arkret-default-tree.txt
          if grep -E '(^|[[:space:]])(openmls|reqwest|tokio|arkret-http-client|arkret-server) v' /tmp/arkret-default-tree.txt; then
            echo "default arkret feature pulled a heavy runtime dependency"
            exit 1
          fi
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features client
      - run: cargo check --no-default-features --features server
      - run: cargo check --no-default-features --features mls
      - run: cargo check --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo run --example export_openapi --features server

  wasm:
    name: wasm32 checks
    runs-on: ubuntu-latest
    # The client and MLS surfaces support wasm32. Keep MLS in this job because
    # it is the workspace path that activates getrandom 0.3's wasm_js backend
    # through OpenMLS; checking only the client and identifier crates does not
    # exercise that RNG generation.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p arkret --target wasm32-unknown-unknown --no-default-features --features client
      - run: cargo check -p arkret-mls --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p arkret-identifiers --target wasm32-unknown-unknown --no-default-features

  embedded-snapshot:
    name: embedded spec snapshot drift gate
    runs-on: ubuntu-latest
    # Hard gate (SDK-TEST-07): the embedded spec artifact snapshot MUST match
    # the live spec. ARKRET_REQUIRE_SPEC=1 turns the otherwise-skipping test
    # into a failure when the spec checkout is missing, so this job can never
    # silently pass without comparing. Refresh the snapshot with
    # `python tools/refresh-embedded-artifacts.py` when the spec moves.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Run embedded snapshot drift gate
        working-directory: arkret-rust-sdk
        env:
          ARKRET_REQUIRE_SPEC: "1"
          ARKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
        run: cargo test -p arkret-schema --lib embedded_spec_artifacts_match_live_spec_when_available

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          # Catch broken intra-doc links and missing-docs regressions early.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D warnings"
        run: cargo doc --no-deps --all-features --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned MSRV — bumping requires a workspace Cargo.toml change and
          # a CHANGELOG entry. Keeping a separate job documents the contract.
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `.deny.toml` at repo root drives the policy. Run all checks so
          # license, advisory, ban and source policies are all enforced.
          command: check
          arguments: --config .deny.toml

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --workspace --baseline-rev HEAD~1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --config tarpaulin.toml --out Xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: true

  package-check:
    name: local package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: python tools/check-publish-order.py
      - run: cargo package --workspace --locked --no-verify

  spec-drift:
    name: spec artifact drift report
    runs-on: ubuntu-latest
    # Hard gate: fails when the SDK-declared spec coverage drifts in either
    # direction, including active spec entries missing from ARTIFACT_BACKED_*.
    # R3 sync (spec @ b47ff6ec): coverage extended to the new agent event
    # kinds (ak.agent.draft.propose, ak.agent.action_request,
    # ak.agent.action_{approve,reject}), the ak.self.call.media.exchange.issue_token
    # operation, and the new media-service-binding / accountable_to.strict_reject
    # profiles. See docs/architecture.md#spec-drift-coverage-ci for the runbook.
    steps:
      - uses: actions/checkout@v4
        with:
          path: arkret-rust-sdk
      - uses: actions/checkout@v4
        with:
          repository: arkret-org/arkret-spec
          path: arkret-spec
          # Public spec repo; if private, set a PAT under
          # secrets.SPEC_READ_TOKEN and pass `token: ${{ secrets.SPEC_READ_TOKEN }}`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-rust-sdk
      - name: Verify embedded artifact generator
        working-directory: arkret-rust-sdk
        run: python tools/test_refresh_embedded_artifacts.py
      - name: Verify embedded artifact snapshot
        working-directory: arkret-rust-sdk
        run: >-
          python tools/refresh-embedded-artifacts.py --check
          ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
      - name: Reject registry-derived SDK surface drift
        working-directory: arkret-rust-sdk
        shell: pwsh
        run: |
          $artifacts = "${{ github.workspace }}/arkret-spec/spec/v1/artifacts"
          ./tools/sync-spec-generated.ps1 -ArtifactsDir $artifacts -Check
      - name: Verify claimable-profile operation coverage matrix
        working-directory: arkret-rust-sdk
        run: >-
          python tools/generate-operation-coverage-matrix.py --check
          --artifacts ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
      - name: Run spec_drift_report
        working-directory: arkret-rust-sdk
        env:
          ARKRET_SPEC_ARTIFACTS: ${{ github.workspace }}/arkret-spec/spec/v1/artifacts
        run: cargo run --example spec_drift_report
