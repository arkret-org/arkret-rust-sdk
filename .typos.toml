[default]
extend-ignore-re = [
    # base 58 strings with spaces every four chars.
    # this would also match regular sentence parts with eight or more words of
    # exactly four characters in row, but that doesn't really happen.
    "[1-9A-Za-z]{4}( [1-9A-Za-z]{4}){7,}",
    # some heuristics for base64 strings with no false matches found at the
    # time of writing.
    "[A-Za-z0-9+=]{72,}",
    "([A-Za-z0-9+=]|\\\\\\s\\*){72,}",
    "[0-9+][A-Za-z0-9+]{30,}[a-z0-9+]",
    "\\$[A-Z0-9+][A-Za-z0-9+]{6,}[a-z0-9+]",
    "\\b[a-z0-9+/=][A-Za-z0-9+/=]{7,}[a-z0-9+/=][A-Z]\\b",
    "^[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{8}$",
    # deliberately fake SCID in identity tests
    "zNOTtheRealScid",
]

[default.extend-identifiers]
WeeChat = "WeeChat"
WebAuthnCose = "WebAuthnCose"
CoseCbor = "CoseCbor"

[default.extend-words]
bellow = "below"
COSE = "COSE"
Cose = "Cose"
OTKs = "OTKs"
PN = "PN"
stat = "state"
sing = "sign"
singed = "signed"
singing = "signing"
# base64 false positives
Nd = "Nd"
Abl = "Abl"
Som = "Som"
Ba = "Ba"
arkret = "arkret"
openid = "openid"
ratelimit = "ratelimit"
webp = "webp"
# accepted variant spelling
unparseable = "unparseable"
# hyphenated prefix: mis-labelled, mis-read, mis-authorize
mis = "mis"
# Unicode-normalization tests around "café"
caf = "caf"
Caf = "Caf"
# constant-time / digest test literal b"abd"
abd = "abd"

[files]
extend-exclude = [
    "*.json",
    "Cargo.lock",
    "target",
]
