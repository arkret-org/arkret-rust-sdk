[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
cokret-contracts = { version = "1.0.0", path = "crates/contracts", default-features = false }
cokret-http-client = { version = "1.0.0", path = "crates/http-client", default-features = false }
cokret-core = { version = "1.0.0", path = "crates/core", default-features = false }
cokret-ffi = { version = "1.0.0", path = "crates/ffi", default-features = false }
cokret-html = { version = "1.0.0", path = "crates/html", default-features = false }
cokret-identifiers = { version = "1.0.0", path = "crates/identifiers", default-features = false }
cokret-keystore = { version = "1.0.0", path = "crates/keystore", default-features = false }
cokret-crypto = { version = "1.0.0", path = "crates/crypto", default-features = false }
cokret-server = { version = "1.0.0", path = "crates/server", default-features = false }
cokret-signatures = { version = "1.0.0", path = "crates/signatures", default-features = false }
cokret-testing = { version = "1.0.0", path = "crates/testing", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bs58 = { version = "0.5.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "rand_core"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "getrandom"] }
chrono-tz = { version = "0.10.4", default-features = false }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }
# Pinned to a specific commit (not a mutable `branch = "main"`) so E2EE/MLS
# core builds are reproducible and upstream `main` churn can't silently change
# crypto behavior. Bump deliberately under review when adopting a new openmls.
openmls = { git = "https://github.com/openmls/openmls.git", rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911", default-features = false }
openmls_basic_credential = { git = "https://github.com/openmls/openmls.git", rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911", default-features = false }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls.git", rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911", default-features = false }
regex = { version = "1.11.1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12.24", default-features = false }
salvo = { version = "0.93.0", default-features = false }
salvo-oapi = { version = "0.93.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
subtle = { version = "2.6.1", default-features = false }
parking_lot = { version = "0.12.5", default-features = false }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
thiserror = { version = "2.0.17", default-features = false }
tls_codec = { version = "0.4.2", default-features = false, features = ["mls", "serde", "std"] }
uuid = { version = "1.10", default-features = false, features = ["std", "v7", "serde"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
url = { version = "2.5.7", default-features = false }
# Platform KeyStore native backends. Each is brought in only by its target
# OS via per-target [target.<cfg>.dependencies] in `crates/core/Cargo.toml`,
# behind the matching `keystore-*` feature gate. They appear here so the
# version pin lives in one place.
security-framework = { version = "3.5.0", default-features = false }
secret-service = { version = "5.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }
windows = { version = "0.62.2", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = "warn"
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tarpaulin_include)',
] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
assigning_clones = "allow"
box_default = "allow"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mut_mut = "warn"
needless_borrow = "warn"
nonstandard_macro_braces = "warn"
redundant_clone = "warn"
str_to_string = "warn"
todo = "warn"
unnecessary_semicolon = "warn"
unused_async = "warn"

[profile.dev]
debug = 0

[profile.dev.package]
sha2 = { opt-level = 2 }

[profile.reldev]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2

[profile.reldbg]
inherits = "dbg"
opt-level = 3

[profile.dist]
inherits = "release"
strip = "debuginfo"
lto = true
opt-level = "s"

[profile.profiling]
inherits = "release"
lto = false
debug = true

[profile.bench]
inherits = "release"
lto = false
