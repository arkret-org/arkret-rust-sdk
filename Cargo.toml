[workspace]
members = [
    "crates/auth",
    "crates/bootstrap",
    "crates/canonical",
    "crates/crypto",
    "crates/egress-policy",
    "crates/egress-reqwest",
    "crates/event-draft",
    "crates/hlc",
    "crates/http-client",
    "crates/identifiers",
    "crates/identity",
    "crates/keystore",
    "crates/locale",
    "crates/mls",
    "crates/models-collaboration",
    "crates/models-crypto",
    "crates/models-discovery",
    "crates/models-identity",
    "crates/models-integration",
    "crates/policy",
    "crates/push-policy",
    "crates/rate-limit",
    "crates/retry",
    "crates/schema",
    "crates/schema-conformance",
    "crates/sdk",
    "crates/server",
    "crates/signatures",
    "crates/state",
    "crates/test-kit",
    "crates/wire",
]
default-members = [
    "crates/auth",
    "crates/bootstrap",
    "crates/canonical",
    "crates/crypto",
    "crates/egress-policy",
    "crates/egress-reqwest",
    "crates/event-draft",
    "crates/hlc",
    "crates/http-client",
    "crates/identifiers",
    "crates/identity",
    "crates/keystore",
    "crates/locale",
    "crates/mls",
    "crates/models-collaboration",
    "crates/models-crypto",
    "crates/models-discovery",
    "crates/models-identity",
    "crates/models-integration",
    "crates/policy",
    "crates/push-policy",
    "crates/rate-limit",
    "crates/retry",
    "crates/schema",
    "crates/sdk",
    "crates/server",
    "crates/signatures",
    "crates/state",
    "crates/wire",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
rust-version = "1.98"

[workspace.dependencies]
# AES-128-GCM: the AEAD of the only ACTIVE MLS ciphersuite row
# (mls-ciphersuite-registry.json `MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519`),
# used by the `ak.signal_exporter_aead.v1` Signal rail.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1.89"
arkret-auth = { version = "0.3.0", path = "crates/auth", default-features = false }
arkret-bootstrap = { version = "0.3.0", path = "crates/bootstrap", default-features = false }
arkret-canonical = { version = "0.3.0", path = "crates/canonical", default-features = false }
arkret-crypto = { version = "0.3.0", path = "crates/crypto", default-features = false }
arkret-egress-policy = { version = "0.3.0", path = "crates/egress-policy", default-features = false }
arkret-egress-reqwest = { version = "0.3.0", path = "crates/egress-reqwest", default-features = false }
arkret-event-draft = { version = "0.3.0", path = "crates/event-draft", default-features = false }
arkret-hlc = { version = "0.3.0", path = "crates/hlc", default-features = false }
arkret-http-client = { version = "0.3.0", path = "crates/http-client", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "crates/identifiers", default-features = false }
arkret-identity = { version = "0.3.0", path = "crates/identity", default-features = false }
arkret-keystore = { version = "0.3.0", path = "crates/keystore", default-features = false }
arkret-locale = { version = "0.3.0", path = "crates/locale", default-features = false }
arkret-mls = { version = "0.3.0", path = "crates/mls", default-features = false }
arkret-models-collaboration = { version = "0.3.0", path = "crates/models-collaboration", default-features = false }
arkret-models-crypto = { version = "0.3.0", path = "crates/models-crypto", default-features = false }
arkret-models-discovery = { version = "0.3.0", path = "crates/models-discovery", default-features = false }
arkret-models-identity = { version = "0.3.0", path = "crates/models-identity", default-features = false }
arkret-models-integration = { version = "0.3.0", path = "crates/models-integration", default-features = false }
arkret-policy = { version = "0.3.0", path = "crates/policy", default-features = false }
arkret-push-policy = { version = "0.3.0", path = "crates/push-policy", default-features = false }
arkret-rate-limit = { version = "0.3.0", path = "crates/rate-limit", default-features = false }
arkret-retry = { version = "0.3.0", path = "crates/retry", default-features = false }
arkret-schema = { version = "0.3.0", path = "crates/schema", default-features = false }
arkret-schema-conformance = { version = "0.3.0", path = "crates/schema-conformance", default-features = false }
arkret-server = { version = "0.3.0", path = "crates/server", default-features = false }
arkret-signatures = { version = "0.3.0", path = "crates/signatures", default-features = false }
arkret-state = { version = "0.3.0", path = "crates/state", default-features = false }
arkret-test-kit = { version = "0.3.0", path = "crates/test-kit", default-features = false }
arkret-wire = { version = "0.3.0", path = "crates/wire", default-features = false }
atomic-write-file = "0.3.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
blake3 = { version = "1.8.7", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false }
# Dev-only microbenchmark harness (SDK-SOTA-03). Excluded from cargo-deny via
# `.deny.toml`; benches compile under `--all-targets` but are never run in CI.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc"] }
diesel = { version = "2.3", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
futures-util = { version = "0.3", default-features = false }
# `getrandom` 0.2 remains as a wasm feature-unification alias for legacy
# transitive consumers; current direct cryptography dependencies use the 0.4
# RNG stack.
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
getrandom_02 = { package = "getrandom", version = "0.2" }
hex = "0.4.3"
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
# RFC 9180 HPKE (rozbb/rust-hpke). Every transitive dep it needs (aes-gcm,
# hkdf 0.12, sha2 0.10, rand_core 0.9, x25519-dalek, chacha20poly1305) is
# already pulled in by the OpenMLS stack, so this adds no new version churn.
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
idna = { version = "1.1.0", default-features = true }
jsonschema = { version = "0.56.0", default-features = false }
# Use the latest stable, mutually compatible OpenMLS releases from crates.io.
openmls = { version = "0.9.0", default-features = false }
openmls_basic_credential = { version = "0.6.0", default-features = false }
openmls_rust_crypto = { version = "0.6.0", default-features = false }
openmls_traits = { version = "0.6.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
precis-profiles = { version = "0.1.13", default-features = false }
proptest = { version = "1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.13.4", default-features = false, features = ["query"] }
# OpenAPI 3 schema derives (`ToSchema`) for wire model types. Optional and
# gated behind each model crate's `openapi` feature so the no-default data
# graph stays framework-free; enabled by service crates that serve OpenAPI.
salvo-oapi = { version = "=0.96.0", default-features = false, features = ["rfc9457"] }
# Linux KeyStore backend, enabled only by the keystore crate target cfg.
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
# macOS KeyStore backend, enabled only by the keystore crate target cfg.
security-framework = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde_path_to_error = { version = "0.1.20", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
tls_codec = { version = "0.5.0", default-features = false, features = ["mls", "serde", "std"] }
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
unicode-security = { version = "0.1.2", default-features = false }
url = { version = "2.5.8", default-features = false }
uuid = { version = "1.26", default-features = false, features = ["std", "v7", "serde"] }
voprf = { version = "0.6.0-pre.1", default-features = false, features = ["ristretto255-ciphersuite"] }
web-time = "1.1.0"
# Windows KeyStore backend, enabled only by the keystore crate target cfg.
windows = { version = "0.62.2", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[workspace.lints.rust]
rust_2018_idioms = "warn"
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tarpaulin_include)',
] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
assigning_clones = "allow"
box_default = "allow"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mut_mut = "warn"
needless_borrow = "warn"
nonstandard_macro_braces = "warn"
redundant_clone = "warn"
str_to_string = "warn"
todo = "warn"
unnecessary_semicolon = "warn"
unused_async = "warn"

[profile.dev]
debug = 0

[profile.dev.package]
sha2 = { opt-level = 2 }

[profile.reldev]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2

[profile.reldbg]
inherits = "dbg"
opt-level = 3

[profile.dist]
inherits = "release"
strip = "debuginfo"
lto = true
opt-level = "s"

[profile.profiling]
inherits = "release"
lto = false
debug = true

[profile.bench]
inherits = "release"
lto = false
