[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
argon2 = {version = "0.5.3",default-features = false,features = ["alloc", "password-hash"]}
base64 = {version = "0.22.1",default-features = false,features = ["std"]}
blake3 = {version = "1.5.5",default-features = false}
bs58 = {version = "0.5.1",default-features = false,features = ["std"]}
chacha20poly1305 = {version = "0.10.1",default-features = false,features = ["alloc"]}
chrono = {version = "0.4.45",default-features = false,features = ["clock", "std", "serde"]}
chrono-tz = {version = "0.10.4",default-features = false}
# Dev-only microbenchmark harness (SDK-SOTA-03). Excluded from cargo-deny via
# `.deny.toml`; benches compile under `--all-targets` but are never run in CI.
criterion = {version = "0.7",default-features = false,features = ["cargo_bench_support"]}
arkret-core = {version = "0.3.0",path = "crates/core",default-features = false}
arkret-crypto = {version = "0.3.0",path = "crates/crypto",default-features = false}
arkret-ffi = {version = "0.3.0",path = "crates/ffi",default-features = false}
arkret-html = {version = "0.3.0",path = "crates/html",default-features = false}
arkret-http-client = {version = "0.3.0",path = "crates/http-client",default-features = false}
arkret-identifiers = {version = "0.3.0",path = "crates/identifiers",default-features = false}
arkret-keystore = {version = "0.3.0",path = "crates/keystore",default-features = false}
arkret-server = {version = "0.3.0",path = "crates/server",default-features = false}
arkret-signatures = {version = "0.3.0",path = "crates/signatures",default-features = false}
diesel = {version = "2.3",default-features = false}
ed25519-dalek = {version = "2.2.0",default-features = false,features = ["std", "rand_core"]}
futures-util = {version = "0.3",default-features = false}
# RNG stack is deliberately dual-track (SDK-SOTA-06): ed25519-dalek 2.x /
# x25519-dalek 2.x pin the rand_core 0.6 ecosystem (getrandom 0.2,
# rand_chacha 0.3), while the rest of the workspace is on getrandom 0.4.
# Converge to a single track once curve25519-dalek / ed25519-dalek publish a
# rand_core 0.9+ line; until then the getrandom 0.2 duplicate (managed via the
# explicit `getrandom_02` rename below, same for rand_core/rand_chacha) is
# intentional — exempt it in any cargo-deny `[bans] multiple-versions` check
# rather than "fixing" the duplication.
getrandom = {version = "0.4.2",default-features = false,features = ["std"]}
getrandom_02 = {package = "getrandom",version = "0.2"}
gloo-timers = {version = "0.3",default-features = false}
hex = "0.4.3"
# RFC 9180 HPKE (rozbb/rust-hpke). Every transitive dep it needs (aes-gcm,
# hkdf 0.12, sha2 0.10, rand_core 0.9, x25519-dalek, chacha20poly1305) is
# already pulled in by the OpenMLS stack, so this adds no new version churn.
hpke = {version = "0.13",default-features = false,features = ["x25519", "std"]}
hkdf = {version = "0.13.0",default-features = false}
hmac = {version = "0.13.0",default-features = false}
# Pinned to a specific commit (not a mutable `branch = "main"`) so E2EE/MLS
# core builds are reproducible and upstream `main` churn can't silently change
# crypto behavior. Bump deliberately under review when adopting a new OpenMLS.
openmls = {git = "https://github.com/openmls/openmls.git",rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911",default-features = false}
openmls_basic_credential = {git = "https://github.com/openmls/openmls.git",rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911",default-features = false}
openmls_rust_crypto = {git = "https://github.com/openmls/openmls.git",rev = "d5a3aa7b595cb445614aa04b38f3d3aa42cf4911",default-features = false}
parking_lot = {version = "0.12.5",default-features = false}
proptest = {version = "1",default-features = false}
regex = {version = "1.12.4",default-features = false,features = ["std", "unicode-perl"]}
reqwest = {version = "0.13.4",default-features = false,features = ["query"]}
salvo = {git = "https://github.com/salvo-rs/salvo.git",rev = "d1365f0d0e8e0f35ed3a04fb2faec861881c9863",default-features = false}
salvo-oapi = {git = "https://github.com/salvo-rs/salvo.git",rev = "d1365f0d0e8e0f35ed3a04fb2faec861881c9863",default-features = false}
# Linux KeyStore backend, enabled only by the keystore crate target cfg.
secret-service = {version = "5.1.0",default-features = false,features = ["rt-tokio-crypto-rust"]}
rand_chacha = {version = "0.10.0",default-features = false}
rand_core = {version = "0.6.4",default-features = false}
# rand_core 0.9 alias for the HPKE RNG interface (rust-hpke is on the 0.9
# line; x25519-dalek keeps `rand_core` on 0.6). Same rename pattern as
# `getrandom_02`; the 0.9 duplicate is already in the tree via the MLS stack.
rand_core_09 = {package = "rand_core",version = "0.9",default-features = false}
# macOS KeyStore backend, enabled only by the keystore crate target cfg.
security-framework = {version = "3.7.0",default-features = false}
serde = {version = "1.0.228",default-features = false,features = ["std", "derive"]}
serde_json = {version = "1.0.150",default-features = false,features = ["std"]}
sha2 = {version = "0.11.0",default-features = false}
subtle = {version = "2.6.1",default-features = false}
thiserror = {version = "2.0.18",default-features = false}
tls_codec = {version = "0.4.2",default-features = false,features = ["mls", "serde", "std"]}
tokio = {version = "1.52.3",default-features = false,features = ["sync"]}
tokio-util = {version = "0.7",default-features = false}
tracing = {version = "0.1.44",default-features = false,features = ["std", "attributes"]}
unicode-normalization = {version = "0.1.25",default-features = false,features = ["std"]}
url = {version = "2.5.8",default-features = false}
uuid = {version = "1.23",default-features = false,features = ["std", "v7", "serde"]}
wasm-bindgen-futures = "0.4"
# Windows KeyStore backend, enabled only by the keystore crate target cfg.
windows = {version = "0.62.2",default-features = false}
x25519-dalek = {version = "2.0.1",default-features = false,features = ["static_secrets", "getrandom"]}
zeroize = {version = "1.8.2",default-features = false,features = ["derive"]}

[workspace.lints.rust]
rust_2018_idioms = "warn"
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tarpaulin_include)',
] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
assigning_clones = "allow"
box_default = "allow"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mut_mut = "warn"
needless_borrow = "warn"
nonstandard_macro_braces = "warn"
redundant_clone = "warn"
str_to_string = "warn"
todo = "warn"
unnecessary_semicolon = "warn"
unused_async = "warn"

[profile.dev]
debug = 0

[profile.dev.package]
sha2 = { opt-level = 2 }

[profile.reldev]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2

[profile.reldbg]
inherits = "dbg"
opt-level = 3

[profile.dist]
inherits = "release"
strip = "debuginfo"
lto = true
opt-level = "s"

[profile.profiling]
inherits = "release"
lto = false
debug = true

[profile.bench]
inherits = "release"
lto = false
