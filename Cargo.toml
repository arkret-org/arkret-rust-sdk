[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[workspace.dependencies]
contrix-api = { version = "0.1.0", path = "crates/api", default-features = false }
contrix-appservice-api = { version = "0.1.0", path = "crates/appservice-api", default-features = false }
contrix-client = { version = "0.1.0", path = "crates/client", default-features = false }
contrix-client-api = { version = "0.1.0", path = "crates/client-api", default-features = false }
contrix-core = { version = "0.1.0", path = "crates/core", default-features = false }
contrix-events = { version = "0.1.0", path = "crates/events", default-features = false }
contrix-federation-api = { version = "0.1.0", path = "crates/federation-api", default-features = false }
contrix-ffi = { version = "0.1.0", path = "crates/ffi", default-features = false }
contrix-html = { version = "0.1.0", path = "crates/html", default-features = false }
contrix-identifiers = { version = "0.1.0", path = "crates/identifiers", default-features = false }
contrix-identity-api = { version = "0.1.0", path = "crates/identity-api", default-features = false }
contrix-crypto = { version = "0.1.0", path = "crates/crypto", default-features = false }
contrix-operations = { version = "0.1.0", path = "crates/operations", default-features = false }
contrix-push-gateway-api = { version = "0.1.0", path = "crates/push-gateway-api", default-features = false }
contrix-schema = { version = "0.1.0", path = "crates/schema", default-features = false }
contrix-server = { version = "0.1.0", path = "crates/server", default-features = false }
contrix-signatures = { version = "0.1.0", path = "crates/signatures", default-features = false }
contrix-state-res = { version = "0.1.0", path = "crates/state-res", default-features = false }
contrix-store = { version = "0.1.0", path = "crates/store", default-features = false }
contrix-testing = { version = "0.1.0", path = "crates/testing", default-features = false }
contrix-ui = { version = "0.1.0", path = "crates/ui", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }
openmls = { version = "0.8.1", default-features = false }
openmls_basic_credential = { version = "0.5.0", default-features = false }
openmls_rust_crypto = { version = "0.5.1", default-features = false }
regex = { version = "1.11.1", default-features = false, features = ["std"] }
reqwest = { version = "0.12.24", default-features = false }
salvo = { version = "0.93.0", default-features = false }
salvo-oapi = { version = "0.93.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
thiserror = { version = "2.0.17", default-features = false }
tls_codec = { version = "0.4.2", default-features = false, features = ["mls", "serde", "std"] }
ulid = { version = "1.1.4", default-features = false, features = ["std"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
url = { version = "2.5.7", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = "warn"
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tarpaulin_include)',
] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
assigning_clones = "allow"
box_default = "allow"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mut_mut = "warn"
needless_borrow = "warn"
nonstandard_macro_braces = "warn"
redundant_clone = "warn"
str_to_string = "warn"
todo = "warn"
unnecessary_semicolon = "warn"
unused_async = "warn"

[profile.dev]
debug = 0

[profile.dev.package]
sha2 = { opt-level = 2 }

[profile.reldev]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2

[profile.reldbg]
inherits = "dbg"
opt-level = 3

[profile.dist]
inherits = "release"
strip = "debuginfo"
lto = true
opt-level = "s"

[profile.profiling]
inherits = "release"
lto = false
debug = true

[profile.bench]
inherits = "release"
lto = false
